# Throwaway Postgres 17 instances for the max_locks_per_transaction matrix.
#
# Two axes of configuration:
#   * max_locks_per_transaction: 16 / 32 / 48 / 64   (the matrix rows)
#   * max_connections:           20 (default set) and 5 (a variant)
#
# The shared lock table holds about
#     max_locks_per_transaction * (MaxBackends + max_prepared_transactions)
# locks for the whole cluster, where MaxBackends grows with max_connections and
# the various background-worker settings. Every service also gets the same
# tuning (see the repeated -c flags):
#   * shared_buffers=16MB so the lock table can't borrow much extra ("slop")
#     shared memory — keeping the failure threshold close to the formula and
#     on-chart at small table counts; and
#   * max_wal_senders=0 / max_worker_processes=0 / autovacuum_max_workers=1 so
#     max_connections dominates MaxBackends and its effect is clearly visible.
#
# Data lives on tmpfs: the instances are disposable (run.sh discards them) and
# in-memory storage keeps creating thousands of tables fast.
#
# (Compose can't splat a YAML sequence into a command list, so the tuning flags
# are repeated per service rather than shared via an anchor.)
x-pg: &pg
  image: postgres:17
  environment:
    POSTGRES_PASSWORD: password
    POSTGRES_DB: test
  tmpfs:
    - /var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
    interval: 1s
    timeout: 3s
    retries: 60

services:
  # ---- max_connections = 20 (default set; also hosts the +1-index tables) ----
  pg_c20_l16:
    <<: *pg
    ports: ["5433:5432"]
    command: [postgres, -c, max_connections=20, -c, max_locks_per_transaction=16, -c, shared_buffers=16MB, -c, max_wal_senders=0, -c, max_worker_processes=0, -c, autovacuum_max_workers=1]
  pg_c20_l32:
    <<: *pg
    ports: ["5434:5432"]
    command: [postgres, -c, max_connections=20, -c, max_locks_per_transaction=32, -c, shared_buffers=16MB, -c, max_wal_senders=0, -c, max_worker_processes=0, -c, autovacuum_max_workers=1]
  pg_c20_l48:
    <<: *pg
    ports: ["5435:5432"]
    command: [postgres, -c, max_connections=20, -c, max_locks_per_transaction=48, -c, shared_buffers=16MB, -c, max_wal_senders=0, -c, max_worker_processes=0, -c, autovacuum_max_workers=1]
  pg_c20_l64:
    <<: *pg
    ports: ["5436:5432"]
    command: [postgres, -c, max_connections=20, -c, max_locks_per_transaction=64, -c, shared_buffers=16MB, -c, max_wal_senders=0, -c, max_worker_processes=0, -c, autovacuum_max_workers=1]

  # ---- max_connections = 5 (variant) ----
  pg_c5_l16:
    <<: *pg
    ports: ["5443:5432"]
    command: [postgres, -c, max_connections=5, -c, max_locks_per_transaction=16, -c, shared_buffers=16MB, -c, max_wal_senders=0, -c, max_worker_processes=0, -c, autovacuum_max_workers=1]
  pg_c5_l32:
    <<: *pg
    ports: ["5444:5432"]
    command: [postgres, -c, max_connections=5, -c, max_locks_per_transaction=32, -c, shared_buffers=16MB, -c, max_wal_senders=0, -c, max_worker_processes=0, -c, autovacuum_max_workers=1]
  pg_c5_l48:
    <<: *pg
    ports: ["5445:5432"]
    command: [postgres, -c, max_connections=5, -c, max_locks_per_transaction=48, -c, shared_buffers=16MB, -c, max_wal_senders=0, -c, max_worker_processes=0, -c, autovacuum_max_workers=1]
  pg_c5_l64:
    <<: *pg
    ports: ["5446:5432"]
    command: [postgres, -c, max_connections=5, -c, max_locks_per_transaction=64, -c, shared_buffers=16MB, -c, max_wal_senders=0, -c, max_worker_processes=0, -c, autovacuum_max_workers=1]
