query InventoryAdjustments(
  $storeId: String!
  $adjustmentDateFrom: DateTime
  $adjustmentDateTo: DateTime
  # Defaults to an id no master list can have, so that a report run without the
  # master list filter matches no items here rather than fetching every item
  # that is on any master list. convert_data ignores these ids when the filter
  # is unset, so an explicit null is still correct, just less economical.
  $masterListId: String = ""
) {
  # Item ids of the master list chosen in the report filters. Fetched at the top
  # level and matched on item id in convert_data rather than as
  # `item { masterLists }` inside each invoice line: that made the query three
  # nested lists deep, which overflowed the stack of the actix worker resolving
  # it on debug builds (#897).
  masterListItems: items(
    storeId: $storeId
    filter: { masterListId: { equalTo: $masterListId } }
  ) {
    ... on ItemConnector {
      nodes {
        id
      }
    }
  }
  # Query inventory adjustment invoices
  invoices(
    storeId: $storeId
    filter: {
      type: { equalAny: [INVENTORY_ADDITION, INVENTORY_REDUCTION] }
      verifiedDatetime: {
        afterOrEqualTo: $adjustmentDateFrom
        beforeOrEqualTo: $adjustmentDateTo
      }
    }
  ) {
    ... on InvoiceConnector {
      nodes {
        id
        invoiceNumber
        type
        verifiedDatetime
        lines {
          ... on InvoiceLineConnector {
            nodes {
              id
              itemCode
              itemName
              batch
              expiryDate
              numberOfPacks
              packSize
              location {
                id
                code
                name
              }
              stockLine {
                id
              }
              inventoryAdjustmentReason {
                id
                reason
              }
              item {
                id
                code
                name
                unitName
              }
            }
          }
        }
      }
    }
  }
  # Query finalised stocktakes that have inventory adjustments
  stocktakes(
    storeId: $storeId
    filter: {
      status: { equalTo: FINALISED }
      finalisedDatetime: {
        afterOrEqualTo: $adjustmentDateFrom
        beforeOrEqualTo: $adjustmentDateTo
      }
    }
  ) {
    ... on StocktakeConnector {
      nodes {
        id
        stocktakeNumber
        finalisedDatetime
        inventoryAdditionId
        inventoryReductionId
        lines {
          ... on StocktakeLineConnector {
            nodes {
              id
              snapshotNumberOfPacks
              countedNumberOfPacks
              stockLine {
                id
              }
            }
          }
        }
      }
    }
  }
  store(id: $storeId) {
    ... on StoreNode {
      id
      code
      storeName
      logo
      name(storeId: $storeId) {
        address1
        address2
        code
        email
        phone
      }
    }
  }
}
