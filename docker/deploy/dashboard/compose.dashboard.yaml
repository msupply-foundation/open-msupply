# The deployments dashboard: what is running on this box, and buttons for QA and
# product to start, extend, reseed and remove servers.
#
# Deployed by .github/workflows/docker-deploy-services.yaml whenever a push to
# develop changes this directory - the same workflow as the proxy, for the same
# reason: it is not a deployment of the product, it fronts every deployment at
# once, so it must not move with whichever deploy happened to run next. The
# workflow builds the image (./Dockerfile, the three files baked in) and brings
# it up; nothing here is copied onto the box. Only ~/dashboard/.env is the
# box's own: it holds the GitHub App's client id and secret, and nothing in CI
# writes it.
#
# TWO CONTAINERS, AND THE SPLIT IS THE POINT
#
#   snapshot   has the docker socket, has no listener
#   dashboard  has a listener, has no docker socket
#
# They share one named volume holding one JSON file. Anything holding
# /var/run/docker.sock has root on the box - `:ro` on a socket mount restricts
# the socket FILE and not the API behind it - so the container that is reachable
# through the proxy must not have it. Splitting them means there is no request
# path at all from the browser to the daemon.
#
# Nor does GitHub: `snapshot` never talks to it, so it runs with no network at
# all. Everything GitHub knows is looked up by `dashboard`, with the token of
# whoever is signed in and looking - there is no standing GitHub credential on
# this box. See web.mjs.
#
# The buttons do not change that. A click asks `dashboard` to DISPATCH the
# workflow that owns the action, on develop, with the token of the person who
# signed in - see web.mjs - and the workflow does the deploy on a runner, as it
# would from GitHub's own form. So the page can never do anything those forms
# could not, and never anything the person clicking could not.
#
# IT NEEDS NO PROXY CONFIGURATION
#
# The Caddyfile on this box routes the first label of the hostname straight to a
# container of that name on port 8000. That is a pure function, so a container
# named `dashboard` on `oms-edge` is served at `dashboard.<DEPLOY_DOMAIN>` with
# no route added and nothing reloaded.
#
# Two consequences of leaning on that:
#
#   - The listener MUST be on 8000. The proxy dials `<name>:8000` for
#     everything; a dashboard on :80 is a 502 on a container that is plainly up.
#   - `dashboard` is now a reserved deployment name on this box. Deploying a
#     deployment called `dashboard` fails at `compose up` on the duplicate
#     container name, which is a loud failure rather than a silent mis-route,
#     but it is worth knowing why.

name: oms-dashboard

services:
  # Reads the daemon, writes the JSON. No ports and no network.
  snapshot:
    # One image for both containers, tagged with the git tree hash of this
    # directory - the workflow passes it, and keeps the previous tag on the box
    # to roll back to. `local` is for a hand-run `compose up`. One image means
    # a change to any file recreates both, so the two never run different
    # versions of the deployments.json they share. Node pinned by digest in
    # the Dockerfile, which says why.
    #
    # Both services carry the same `build`; the second is a cache hit.
    build: .
    image: oms-dashboard:${OMS_DEPLOY_CONFIG:-local}
    container_name: oms-dashboard-snapshot
    restart: unless-stopped
    # snapshot.mjs talks to the Engine API over the socket with node's own
    # `http`, so it needs neither the docker CLI nor any npm dependency.
    command: ["node", "/app/snapshot.mjs"]
    # The socket is a bind-mounted file, not a network address, so this needs
    # no network to reach the daemon - and having none means a compromise of
    # this container, which holds root on the box, cannot phone anywhere.
    network_mode: none
    environment:
      # Only used to build each deployment's URL for the page. The page still
      # works without it, minus the links, so it is not `:?`-required here -
      # but it must match the repository variable, like the proxy's copy.
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:-}
      TICK_SECONDS: ${TICK_SECONDS:-15}
      DF_SECONDS: ${DF_SECONDS:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - snapshot:/snapshot

  # Signs people in, serves them the snapshot with GitHub's view added, and
  # turns clicks into workflow dispatches. Knows nothing about docker.
  dashboard:
    # Node rather than a static file server, because the buttons need something
    # that holds the token and calls GitHub. Still no npm dependency. The same
    # image as `snapshot` - see there.
    build: .
    image: oms-dashboard:${OMS_DEPLOY_CONFIG:-local}
    # The routing key - see the header. Must match the hostname's first label.
    container_name: dashboard
    restart: unless-stopped
    command: ["node", "/app/web.mjs"]
    environment:
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:?GITHUB_REPOSITORY must be set - the workflow passes its own}
      # The GitHub App people sign in through - see the runbook for creating it.
      # From ~/dashboard/.env on the box, the one thing the workflow does not
      # pass. Every read and every dispatch uses the signed-in person's token,
      # so without these nobody can sign in and the page shows nothing.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Its own address is https://dashboard.<DEPLOY_DOMAIN>, which is what the
      # App's callback URL must be. The same value the proxy and the
      # repository variable hold.
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?DEPLOY_DOMAIN must be set - the workflow passes the repository variable}
      # How often the workflow runs are re-read while someone has the page open.
      # Free while nothing changes (conditional requests); everything else is
      # re-read only when a run says it moved.
      GITHUB_SECONDS: ${GITHUB_SECONDS:-15}
      # The branch the buttons dispatch the workflows on. develop, except while
      # trying out a workflow change from its branch before it merges.
      DISPATCH_REF: ${DISPATCH_REF:-develop}
    volumes:
      # Read-only here, written by `snapshot`. web.mjs reads deployments.json
      # from it and serves it, with the runs added, at /api/deployments - which
      # is what the page fetches.
      - snapshot:/srv/snapshot:ro
    networks:
      - edge
    # No published ports, for the same reason no deployment publishes any: the
    # proxy reaches it over oms-edge, and nothing on this box should be
    # reachable off it by any other route.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  # The whole interface between the two containers. Named rather than a host
  # path so it needs no directory created, no ownership set, and nothing on the
  # host to go stale.
  snapshot:

networks:
  edge:
    name: oms-edge
    # External for the same reason every deployment declares it external: a
    # `down -v` here must not take the network out from under the proxy and
    # every deployment still running on it.
    external: true
