# The single definition of a deployed omSupply server.
#
# One file, several targets. `docker-deploy.yaml` supplies the values; the
# topology - one service, three mount points - is identical for every one of
# them, so the difference between the develop environment and a per-PR preview
# is entirely interpolation. OMS_PROJECT is what separates them: compose
# namespaces named volumes by project, so two projects on one daemon share
# nothing.
#
# Defaults to a dev/demo shape: the postgres-flavoured image bundling its own
# postgres inside the container. That is convenient - one container, no
# orchestration - but it couples the app's lifecycle to the database's, which is
# the wrong shape for anything holding data you would miss.
#
# Pointing it at an external postgres instead needs no second file and no
# override layer: set OMS_ENTRYPOINT and the PG_* variables below.
#
# Every default below reproduces the develop environment exactly, so a bare
# `docker compose -f docker/compose.deploy.yaml ...` with only OMS_IMAGE set
# behaves as it always has.

name: ${OMS_PROJECT:-omsupply-develop}

services:
  server:
    image: ${OMS_IMAGE:?OMS_IMAGE must be set}
    # Pinned rather than left to compose's `<project>-server-1`, because it is
    # the stable handle everything else addresses this container by: the deploy
    # job's health inspection, the teardown, and - once previews move behind a
    # reverse proxy - the hostname-to-upstream mapping, which is what lets that
    # proxy hold one static route instead of a generated one per PR.
    container_name: ${OMS_PROJECT:-omsupply-develop}
    restart: unless-stopped
    ports:
      - "${OMS_PORT:-8000}:8000"

    # The postgres-flavoured image's default entrypoint runs
    # initdb/pg_ctl/createdb against a cluster *inside* the container, so an
    # external database needs this set to the image's plain entrypoint,
    # /usr/src/omsupply/server/entry.sh - hardware id, optional reference-data
    # load, exec the server - or a second, unused postgres boots alongside the
    # real one. Either way the image must stay postgres-flavoured: the binary
    # has to be compiled against the postgres backend.
    entrypoint: ${OMS_ENTRYPOINT:-/usr/src/omsupply/server/entry-postgres.sh}

    environment:
      # The defaults restate what local.postgres.yaml already bakes into the
      # image, so the bundled shape behaves exactly as before - but they put the
      # database settings somewhere visible rather than hidden in the image, and
      # they are what the PG_* variables replace for an external server. An
      # unset GitHub variable arrives as the empty string, which `:-` treats as
      # absent, so these apply as written.
      APP__DATABASE__HOST: ${PG_HOST:-localhost}
      APP__DATABASE__PORT: ${PG_PORT:-5432}
      APP__DATABASE__USERNAME: ${PG_USER:-postgres}
      APP__DATABASE__PASSWORD: ${PG_PASSWORD:-password}
      APP__DATABASE__DATABASE_NAME: ${PG_DATABASE:-omsupply-database}

      # Seeding, and the reason it is passed per deploy rather than baked in:
      # `initialise-from-export` starts by DROPPING AND RECREATING the database
      # (server/cli/src/cli.rs, Action::InitialiseFromExport). Left set, it would
      # wipe the deployment on every redeploy. The caller therefore passes it
      # only when it knows the database does not exist yet - see the `allocate`
      # job in docker-pr-preview.yaml - and passes nothing on every deploy after
      # that, so the server migrates the existing data instead.
      #
      # It also disables sync unconditionally, so a seeded deployment cannot
      # reach a central server.
      LOAD_REFERENCE_FILE: ${OMS_LOAD_REFERENCE_FILE:-}
      # Only meaningful alongside the above, and gated the same way: entry.sh
      # runs `refresh-dates` whenever this is true, reference file or not, so
      # left on it would shift a live deployment's dates forward on every
      # redeploy. It exists because a dataset is a snapshot of whenever it was
      # exported, and stale dates make a preview misleading.
      SHOULD_REFRESH_DATES: ${OMS_REFRESH_DATES:-}

      # mDNS discovery is pointless on a server reached over a published port,
      # and is noise on a box running many stacks at once. `Auto` is the enum's
      # own #[default] (server/service/src/settings.rs), so the fallback is a
      # no-op rather than a new opinion - it is spelled out because an empty
      # string here would fail to deserialise as a DiscoveryMode.
      APP__SERVER__DISCOVERY: ${OMS_DISCOVERY:-Auto}

    volumes:
      # A bare name is a named volume; a host path is a bind mount. That is the
      # whole difference between the demo shape and a real deployment, so both
      # are this one file with different values.
      #
      # entry-postgres.sh puts PG_DATA at /database/postgres/data, and the image
      # declares no VOLUME - so without this line every deploy silently destroys
      # the database. At several merges a day that is not a subtle failure.
      # (With an external database nothing writes here, and the mount is inert.)
      - ${OMS_DATABASE_DIR:-omsupply-data}:/database
      # server.base_dir (static and sync files, the validated plugin bucket) and
      # logging.directory from base.yaml, resolved against the image's workdir -
      # so neither is under /database, and until now every deploy silently
      # discarded both, bundled postgres or not.
      - ${OMS_APP_DATA_DIR:-omsupply-app-data}:/usr/src/omsupply/server/app_data
      - ${OMS_LOG_DIR:-omsupply-log}:/usr/src/omsupply/server/log
    healthcheck:
      # The server runs migrations on boot and exits if they fail, so "process
      # alive and answering" is already a meaningful signal. __typename needs no
      # auth and proves actix is routing and the graphql schema loaded.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST http://localhost:8000/graphql
          -H 'Content-Type: application/json'
          -d '{"query":"{ __typename }"}' > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      # First boot runs initdb and the full migration set; later boots are quick.
      start_period: 180s

# Used by the default shape. When the OMS_*_DIR variables point at host paths
# instead, these declarations go unreferenced and compose prunes them.
volumes:
  omsupply-data:
  omsupply-app-data:
  omsupply-log:
