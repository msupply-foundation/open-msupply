<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open mSupply</title>
    <script>
      // Apply the persisted theme before first paint so a dark-theme user
      // never sees a flash of light (key shared with ThemeToggle).
      try {
        var theme = localStorage.getItem('oms-theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
