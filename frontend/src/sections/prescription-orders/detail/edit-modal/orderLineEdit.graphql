# Line writes (spec/prescription-orders/contract.md § lines): id + order +
# item + quantity (units) + directions. Rejections are generic (contract §
# wire traps) and show in-dialog.
mutation upsertPrescriptionOrderLine(
  $storeId: String!
  $input: UpsertPrescriptionOrderLineInput!
) {
  upsertPrescriptionOrderLine(storeId: $storeId, input: $input) {
    ... on PrescriptionOrderLineNode {
      id
    }
  }
}

mutation deletePrescriptionOrderLine($storeId: String!, $id: String!) {
  deletePrescriptionOrderLine(storeId: $storeId, id: $id) {
    ... on DeleteResponse {
      id
    }
  }
}

# The configured abbreviations for directions expansion (consumed read — the
# same list dispensing's line editor uses; rules § lines, AC-N3).
query orderAbbreviations {
  abbreviations {
    id
    text
    expansion
  }
}

# The picked item's canned directions (consumed read; rules § lines) — click
# to apply, then expanded like typed text.
query orderItemDirections($storeId: String!, $itemId: String!) {
  items(storeId: $storeId, filter: { id: { equalTo: $itemId } }) {
    ... on ItemConnector {
      nodes {
        id
        itemDirections {
          id
          directions
          priority
        }
      }
    }
  }
}
