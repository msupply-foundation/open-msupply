# The prescription-order detail (spec/prescription-orders/contract.md):
# header + lines in one read (an order's line set is small; no server paging).
fragment PrescriptionOrderFields on PrescriptionOrderNode {
  id
  prescriptionOrderNumber
  status
  createdDatetime
  prescriptionDatetime
  readyDatetime
  dispensedDatetime
  comment
  customFields
  patientId
  patient {
    id
    name
    code
    dateOfBirth
  }
  clinicianId
  diagnosisId
  programId
  user {
    username
    email
  }
  lines {
    totalCount
    nodes {
      id
      itemId
      quantity
      note
      item {
        id
        code
        name
        unitName
      }
    }
  }
}

query prescriptionOrderDetail($storeId: String!, $id: String!) {
  prescriptionOrder(storeId: $storeId, id: $id) {
    __typename
    ... on PrescriptionOrderNode {
      ...PrescriptionOrderFields
    }
    ... on RecordNotFound {
      description
    }
  }
}

# One partial update carries header edits, custom-field patches, and the
# Ready-to-dispense hand-over (contract § the hand-over). Rejections are
# generic (contract § wire traps) and surface where the save started.
mutation updatePrescriptionOrder(
  $storeId: String!
  $input: UpdatePrescriptionOrderInput!
) {
  updatePrescriptionOrder(storeId: $storeId, input: $input) {
    ... on PrescriptionOrderNode {
      ...PrescriptionOrderFields
    }
  }
}

mutation deletePrescriptionOrderById($storeId: String!, $id: String!) {
  deletePrescriptionOrder(storeId: $storeId, id: $id) {
    ... on DeleteResponse {
      id
    }
  }
}

# The active diagnoses the Diagnosis picker offers (consumed read — the same
# list dispensing's side panel uses).
query orderDiagnosesActive {
  diagnosesActive {
    id
    code
    description
  }
}

# The generated dispensation (contract § the hand-over): the dispensing list
# read filtered by the back-link. The top-level type argument selects the
# prescription permission, matching the dispensing list's own read.
query generatedDispensations($storeId: String!, $prescriptionOrderId: EqualFilterStringInput!) {
  invoices(
    storeId: $storeId
    filter: { prescriptionOrderId: $prescriptionOrderId }
    type: [PRESCRIPTION]
  ) {
    ... on InvoiceConnector {
      nodes {
        id
        invoiceNumber
        status
      }
    }
  }
}
