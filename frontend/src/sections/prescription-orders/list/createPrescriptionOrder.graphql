# Creation (spec/prescription-orders/contract.md § creation): patient is the
# one required field; omitting prescriptionDatetime stores the creation
# moment. Rejections are generic (contract § wire traps) and show in-dialog.
mutation insertPrescriptionOrder(
  $storeId: String!
  $input: InsertPrescriptionOrderInput!
) {
  insertPrescriptionOrder(storeId: $storeId, input: $input) {
    ... on PrescriptionOrderNode {
      id
    }
  }
}
