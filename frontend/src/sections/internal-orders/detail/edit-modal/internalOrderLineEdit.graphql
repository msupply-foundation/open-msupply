# Internal-order LINE editor (spec/internal-orders S4).
#
# Two save paths (contract › editing lines):
#  · ADD  — batchRequestRequisition inserts the line (server generates the
#    snapshot, suggestion, and the gated price/forecast captures) then updates
#    it with the drafted requested quantity / comment / reason, in one call
#    (its insert phase runs before its update phase). A client-generated line
#    id ties the two phases.
#  · EDIT — updateRequestRequisitionLine carries the changed fields; the reason
#    is cleared server-side when the quantity returns to the suggestion (D30).
# Both carry the draft's forecast method in the update; the server recomputes
# the line only when it differs from the stored one (rules › choosing a method).
#
# ADD mode previews the line BEFORE it exists (OMS-REG-REPL-04.65 — a reload before the
# first save finds nothing): the item's details from a live read, and the line's
# statistics, forecast and suggestion from the forecast preview below — the line
# the insert would create, so the first save reproduces it.

# One item's details for the add-mode draft. Its statistics come from the
# forecast preview below (the line the insert would create), not from here.
query internalOrderItemStats($storeId: String!, $itemId: String!) {
  items(storeId: $storeId, filter: { id: { equalTo: $itemId } }) {
    ... on ItemConnector {
      __typename
      nodes {
        id
        code
        name
        unitName
        defaultPackSize
        doses
        isVaccine
      }
    }
  }
}

# ADD: insert + update in one batch. The insert response is only checked for an
# error typename (a typed insert error gets the generic failure surface,
# error-handling parity); the update response carries the realised line.
mutation addInternalOrderLine(
  $storeId: String!
  $input: BatchRequestRequisitionInput!
) {
  batchRequestRequisition(storeId: $storeId, input: $input) {
    insertRequestRequisitionLines {
      id
      response {
        __typename
      }
    }
    updateRequestRequisitionLines {
      id
      response {
        __typename
        ... on RequisitionLineNode {
          id
        }
        ... on UpdateRequestRequisitionLineError {
          error {
            __typename
            description
            ... on ForecastMethodNotAvailable {
              unavailableReason
            }
          }
        }
      }
    }
  }
}

# DELETE (OMS-REG-REPL-04.71): remove the selected lines in one batch. The batch
# is ATOMIC — any member error rolls the whole batch back, so nothing is removed
# on a partial failure. A validating member still reports DeleteResponse on a
# rolled-back batch (contract › deletion wire trap), so the caller judges the
# batch by whether ANY member errored, never a member's own response.
mutation deleteInternalOrderLines(
  $storeId: String!
  $ids: [DeleteRequestRequisitionLineInput!]!
) {
  batchRequestRequisition(
    storeId: $storeId
    input: { deleteRequestRequisitionLines: $ids }
  ) {
    deleteRequestRequisitionLines {
      id
      response {
        ... on DeleteResponse {
          __typename
          id
        }
        ... on DeleteRequestRequisitionLineError {
          __typename
          error {
            __typename
            description
          }
        }
      }
    }
  }
}

# EDIT: a single line update. Typed errors surface inline (contract › editing
# lines); the success payload is the refreshed line (the parent refetches the
# page regardless, OMS-REG-REPL-04.76).
mutation updateInternalOrderLine(
  $storeId: String!
  $input: UpdateRequestRequisitionLineInput!
) {
  updateRequestRequisitionLine(storeId: $storeId, input: $input) {
    __typename
    ... on RequisitionLineNode {
      id
    }
    ... on UpdateRequestRequisitionLineError {
      error {
        __typename
        description
        ... on ForecastMethodNotAvailable {
          unavailableReason
        }
      }
    }
  }
}

# FORECAST PREVIEW (rules › choosing a method): the draft's line under a method,
# saving nothing — the stored line for an item on the order, else the line its
# insert would create. Null `forecastMethod` keeps the line's own. The forecast
# fields are the same selection as domain/forecast's ForecastLine fragment, so
# the editor shows the draft's forecast as it shows a saved one.
query internalOrderLineForecastPreview(
  $storeId: String!
  $input: RequisitionLineForecastPreviewInput!
) {
  requisitionLineForecastPreview(storeId: $storeId, input: $input) {
    __typename
    ... on RequisitionLineForecastPreviewNode {
      suggestedQuantity
      averageMonthlyConsumption
      availableStockOnHand
      forecastMethod
      forecastMonthlyConsumption
      targetStock
      forecastBreakdown {
        __typename
        ... on AmcForecastNode {
          averageMonthlyConsumption
        }
        ... on PopulationForecastNode {
          populationServed
          courses {
            courseName
            demographicName
            numberOfDoses
            coverageRate
            wastageRate
            targetPopulation
            lossFactor
            annualTargetDoses
            dosesPerUnit
            monthlyDoses
            monthlyUnits
          }
        }
        ... on AncillaryRatioForecastNode {
          principals {
            itemId
            item {
              code
              name
              unitName
            }
            principalMonthlyConsumption
            itemQuantity
            ancillaryQuantity
            monthlyConsumption
          }
        }
      }
      forecastMethodOptions {
        method
        isAvailable
        unavailableReason
      }
    }
    ... on RequisitionLineForecastPreviewError {
      error {
        __typename
        description
        ... on ForecastMethodNotAvailable {
          unavailableReason
        }
      }
    }
  }
}
