# Internal-order DETAIL screen (spec/internal-orders S3).
#
# The header read is `requisition(storeId, id)` → RecordNotFound | RequisitionNode.
# ⚠️ Interim divergence: the lines come from the NESTED `lines` connection
# (client-side sort/filter/pagination), NOT a server-paginated root
# `requisitionLines` query — that query does not exist in the pinned schema or
# the live server (backend gap, open-msupply PR #12526). The spec's
# "server-paginated line table (non-negotiable)" moves server-side once the PR
# lands and the schema is re-pinned. Documented as a backend gap in
# spec/internal-orders/contract.md § "Backend gaps" — a server gap, not a
# frontend divergence (so not in DIVERGENCES.md, per that section).

fragment InternalOrderLine on RequisitionLineNode {
  id
  itemId
  itemName
  comment
  item {
    code
    unitName
    defaultPackSize
    doses
    isVaccine
  }
  requestedQuantity
  suggestedQuantity
  approvedQuantity
  approvalComment
  availableStockOnHand
  averageMonthlyConsumption
  initialStockOnHandUnits
  incomingUnits
  outgoingUnits
  lossInUnits
  additionInUnits
  expiringUnits
  daysOutOfStock
  pricePerUnit
  forecastTotalUnits
  optionId
  reason {
    reason
  }
  # The items this line's item is configured as an ancillary of — backs the
  # "Ancillary of" flag on the Name column (AC-A8); empty when none.
  ancillaryParents {
    id
    name
  }
}

fragment InternalOrderInfo on RequisitionNode {
  id
  requisitionNumber
  status
  colour
  theirReference
  comment
  otherPartyId
  otherPartyName
  otherParty(storeId: $storeId) {
    store {
      isDisabled
    }
  }
  destinationCustomer(storeId: $storeId) {
    id
    name
  }
  minMonthsOfStock
  maxMonthsOfStock
  program {
    id
    name
  }
  orderType
  period {
    id
    name
  }
  approvalStatus
  isEmergency
  createdDatetime
  sentDatetime
  finalisedDatetime
  # Side panel (S5): the creating user (entered-by), the fulfilling inbound
  # shipments (AC-RD1), and the source customer requisition this order was
  # created from (AC-RD2, display gated on a preference). Documents (AC-F1) come
  # from the same node so the Documents tab lists them and Copy carries them.
  user {
    username
  }
  shipments {
    nodes {
      id
      invoiceNumber
      createdDatetime
      user {
        username
      }
    }
  }
  createdFromRequisition {
    id
    requisitionNumber
    createdDatetime
    user {
      username
    }
  }
  documents {
    nodes {
      id
      fileName
      createdDatetime
      totalBytes
    }
  }
  # The ancillary plan (AC-A1/A2), computed server-side on every read: the state
  # drives the toolbar banner + send warning, the deltas back the plan popover.
  # Both lists are always populated regardless of state.
  ancillaryState {
    state
    count
    toAdd {
      itemId
      requiredQuantity
      item {
        code
        name
        unitName
      }
    }
    toUpdate {
      itemId
      requiredQuantity
      currentQuantity
      item {
        code
        name
        unitName
      }
    }
  }
  lines {
    totalCount
    nodes {
      ...InternalOrderLine
    }
  }
}

query internalOrderDetail($storeId: String!, $id: String!) {
  requisition(storeId: $storeId, id: $id) {
    __typename
    ... on RequisitionNode {
      ...InternalOrderInfo
    }
    ... on RecordNotFound {
      __typename
    }
  }
}

# Header-level saves AND the send (status = SENT) both go through
# updateRequestRequisition; the response carries the refreshed node so callers
# splice it back with no refetch. A typed error surfaces its description.
mutation updateInternalOrder(
  $storeId: String!
  $input: UpdateRequestRequisitionInput!
) {
  updateRequestRequisition(storeId: $storeId, input: $input) {
    __typename
    ... on RequisitionNode {
      ...InternalOrderInfo
    }
    ... on UpdateRequestRequisitionError {
      error {
        __typename
        description
      }
    }
  }
}

# Ancillary refresh (spec S3 § ancillary items, AC-A3/A4): ADD inserts the
# missing ancillary lines, UPDATE overwrites stale quantities. The client
# re-queries the order after, so only the outcome __typename is needed; a typed
# error surfaces inline.
mutation refreshAncillaryItems(
  $storeId: String!
  $input: RefreshAncillaryItemsInput!
) {
  refreshAncillaryItems(storeId: $storeId, input: $input) {
    __typename
    ... on RefreshAncillaryItemsSuccess {
      __typename
    }
    ... on RefreshAncillaryItemsError {
      error {
        __typename
        description
      }
    }
  }
}

# The order's activity trail (Log tab, spec S3 § Log tab) — keyed by recordId,
# sorted client-side (oldest first, AC-AL1).
query internalOrderLog($storeId: String!, $recordId: String!) {
  activityLogs(
    storeId: $storeId
    filter: { recordId: { equalTo: $recordId } }
    page: { first: 1000 }
  ) {
    ... on ActivityLogConnector {
      __typename
      totalCount
      nodes {
        id
        type
        datetime
        user {
          username
        }
      }
    }
  }
}
