# One item's full read-only record (spec/items S2). Re-reads the items query
# filtered by id AND isActive:true — an inactive/unknown id resolves to an empty
# page, which the client renders as its not-found state (OMS-REG-CAT-04.32). storeId scopes
# stats, store properties and master-list membership. Three legacy-record fields
# (volumePerPack, margin, weight) are parsed from the item's legacy JSON on the
# server (contract wire trap) — read as normal fields here.
query itemDetail($storeId: String!, $id: EqualFilterStringInput) {
  items(storeId: $storeId, filter: { id: $id, isActive: true }) {
    ... on ItemConnector {
      __typename
      totalCount
      nodes {
        id
        code
        name
        unitName
        type
        strength
        ddd
        isVaccine
        doses
        atcCategory
        universalCode
        msupplyUniversalName
        defaultPackSize
        outerPackSize
        volumePerPack
        volumePerOuterPack
        weight
        margin
        customFields
        restrictedLocationType {
          id
          name
        }
        itemStoreProperties(storeId: $storeId) {
          defaultSellPricePerPack
          ignoreForOrders
        }
        masterLists(storeId: $storeId) {
          id
          code
          name
          description
        }
        stats(storeId: $storeId) {
          stockOnHand
          averageMonthlyConsumption
          monthsOfStockOnHand
        }
        variants {
          id
          name
        }
        ancillaryItems {
          id
        }
      }
    }
  }
}
