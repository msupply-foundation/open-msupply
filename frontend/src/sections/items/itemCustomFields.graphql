# Item-scope custom-field DEFINITIONS (spec/items "custom fields"). Shared by
# the list (one column + one filter per non-hidden definition) and the detail
# Custom-fields tab. Server delivers only item-scope definitions; the client
# further drops Hidden ones (displayMode). `options` carry parentOptionId so the
# option filter can match a parent plus its descendants (AC-P2).
query itemCustomFieldDefinitions {
  customFields(filter: { scope: { equalTo: "item" } }) {
    ... on CustomFieldConnector {
      __typename
      totalCount
      nodes {
        id
        key
        name
        valueType
        kind
        displayMode
        options {
          id
          key
          name
          parentOptionId
        }
      }
    }
  }
}
