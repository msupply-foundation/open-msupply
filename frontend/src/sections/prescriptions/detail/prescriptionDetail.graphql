# The prescription detail read + header/status writes
# (spec/prescriptions/contract.md). One fragment serves the detail query and
# the update mutation so a save can patch the resource in place.
fragment PrescriptionFields on InvoiceNode {
  id
  invoiceNumber
  # The source prescription request, when this dispensation was generated by a
  # hand-over (spec/prescriptions/contract.md § the source request). Null for a
  # prescription dispensed without one.
  prescriptionRequestId
  status
  # The cancellation mirror's marker: a reversal is VERIFIED like any confirmed
  # prescription, so only this tells them apart (contract § cancellation).
  isCancellation
  createdDatetime
  pickedDatetime
  verifiedDatetime
  cancelledDatetime
  backdatedDatetime
  comment
  colour
  theirReference
  clinicianId
  clinician {
    id
    firstName
    lastName
  }
  patient {
    id
    name
    code
    dateOfBirth
    gender
  }
  programId
  program {
    id
    name
  }
  diagnosisId
  nameInsuranceJoinId
  insuranceDiscountAmount
  insuranceDiscountPercentage
  customFields
  insurancePolicy {
    policyNumber
    discountPercentage
    insuranceProviders {
      providerName
    }
  }
  pricing {
    totalAfterTax
  }
  user {
    username
    email
  }
  lines {
    totalCount
    nodes {
      id
      type
      itemId
      itemName
      itemCode
      batch
      expiryDate
      locationName
      packSize
      numberOfPacks
      prescribedQuantity
      note
      sellPricePerPack
      costPricePerPack
      totalAfterTax
      item {
        id
        code
        name
        unitName
        isVaccine
        doses
      }
      stockLine {
        id
      }
    }
  }
}

# The `type` argument does BOTH jobs, so it is the only type pin here. It
# selects the PERMISSION — the server authorises this read against
# PrescriptionQuery alone because it is named; omitted, it falls back to a
# deprecated combined resource demanding all six invoice query permissions at
# once, which locks a dispensary-only user out of the screen the nav already
# let them open (nav gates this route on PRESCRIPTION_QUERY). It also FILTERS,
# so a non-prescription id now reads as RecordNotFound rather than handing back
# a shipment. Singular `type`, not the list the `invoices` queries take.
query prescriptionDetail($storeId: String!, $id: String!) {
  invoice(storeId: $storeId, id: $id, type: PRESCRIPTION) {
    __typename
    ... on InvoiceNode {
      ...PrescriptionFields
    }
    ... on NodeError {
      error {
        description
      }
    }
  }
}

# Header edits, status changes, cancellation, and the payment write all ride
# updatePrescription (spec/prescriptions/contract.md). Typed members:
# InvoiceIsNotEditable, RecordNotFound, InvalidStockSelection (the
# cannot-backdate guard — the name lies, contract wire trap).
mutation updatePrescription(
  $storeId: String!
  $input: UpdatePrescriptionInput!
) {
  updatePrescription(storeId: $storeId, input: $input) {
    __typename
    ... on InvoiceNode {
      ...PrescriptionFields
    }
    ... on UpdatePrescriptionError {
      error {
        __typename
        description
      }
    }
    ... on NodeError {
      error {
        description
      }
    }
  }
}

# Detail delete (spec/prescriptions/contract.md § deletion): editable
# statuses only — VERIFIED/CANCELLED reject with typed CannotEditInvoice.
mutation deletePrescription($storeId: String!, $id: String!) {
  deletePrescription(storeId: $storeId, id: $id) {
    ... on DeleteResponse {
      id
    }
    ... on DeletePrescriptionError {
      error {
        __typename
        description
      }
    }
  }
}

# The active diagnoses the side panel's Diagnosis picker offers
# (spec/prescriptions/contract.md § patient, clinician, program, diagnosis —
# the picker is the only guard; an id outside it fails opaquely).
query diagnosesActive {
  diagnosesActive {
    id
    code
    description
  }
}

# Bulk line delete (detail selection footer; also the date/program-change
# clear-lines flow — spec/prescriptions AC-B2). Same all-or-nothing batch as
# the list delete; the client only ever sends it on an editable prescription.
mutation deletePrescriptionLines(
  $storeId: String!
  $ids: [DeletePrescriptionLineInput!]!
) {
  batchPrescription(
    storeId: $storeId
    input: { deletePrescriptionLines: $ids }
  ) {
    deletePrescriptionLines {
      id
      response {
        ... on DeleteResponse {
          id
        }
        ... on DeletePrescriptionLineError {
          error {
            __typename
            description
          }
        }
      }
    }
  }
}

# The source request's number, for the side panel's back-link
# (spec/prescriptions/ui-surface.md S3 § side panel). The mirror of the request
# side's dispensation lookup: that one filters invoices by request, this one
# reads the request the invoice names.
# `__typename` is selected because the union's other member is RecordNotFound,
# which arrives as `{}` — truthy, and indistinguishable from a node without it.
# The request is a SOFT link (no FK): it is RemoteOwned while the invoice is
# patient-distributed, so any other site holding this invoice legitimately has
# no request to find.
query sourcePrescriptionRequest($storeId: String!, $id: String!) {
  prescriptionRequest(storeId: $storeId, id: $id) {
    __typename
    ... on PrescriptionRequestNode {
      id
      prescriptionRequestNumber
    }
  }
}
