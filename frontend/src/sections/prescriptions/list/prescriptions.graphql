# The prescriptions list (spec/prescriptions/contract.md § the list): the
# shared invoices query pinned to type PRESCRIPTION. The server forces the
# store scope and excludes cancellation reversals; exactly ONE sort key is
# sent (contract wire trap — the resolver honours only the last).
#
# The top-level `type` argument does BOTH jobs, so it is the only type pin here.
# It selects the PERMISSION — the server authorises this read against
# PrescriptionQuery alone because it is named; omitted, it falls back to a
# deprecated combined resource demanding all six invoice query permissions at
# once. It also OVERWRITES `filter.type` server-side, so a `filter.type` sent
# alongside is dead weight (spec/navigation/contract.md § wire traps). A literal,
# not a variable: this query serves one screen pinned to one type, so no caller
# can forget it — and forgetting it would now widen the rows, not just the
# permission.
#
# `withMedicines` reads each record's lines for the Medicines column, only in a
# store that dispenses on the Simple screen (spec/prescriptions contract ›
# Dispensing records). The lines are batched across the page server-side.
query prescriptions(
  $storeId: String!
  $filter: InvoiceFilterInput
  $sort: [InvoiceSortInput!]
  $page: PaginationInput
  $withMedicines: Boolean = false
) {
  invoices(
    storeId: $storeId
    filter: $filter
    sort: $sort
    page: $page
    type: [PRESCRIPTION]
  ) {
    ... on InvoiceConnector {
      totalCount
      nodes {
        id
        invoiceNumber
        status
        otherPartyName
        isForUnnamedPatient
        colour
        comment
        theirReference
        createdDatetime
        backdatedDatetime
        customFields
        lines @include(if: $withMedicines) {
          nodes {
            type
            itemId
            itemName
            packSize
            numberOfPacks
          }
        }
      }
    }
  }
}

# List bulk delete (spec/prescriptions/contract.md § deletion). The selection
# is pre-checked client-side (OMS-REG-DIS-03.45) so only deletable rows are ever
# sent — load-bearing, because the batch is all-or-nothing AND misreports
# rolled-back rows as deleted (contract wire trap).
mutation deletePrescriptions($storeId: String!, $ids: [String!]!) {
  batchPrescription(storeId: $storeId, input: { deletePrescriptions: $ids }) {
    deletePrescriptions {
      id
      response {
        ... on DeleteResponse {
          id
        }
        ... on DeletePrescriptionError {
          error {
            __typename
            description
          }
        }
      }
    }
  }
}

# Verify all (spec/prescriptions contract › verifying the month's records): the
# store's PICKED dispensing records picked up to the chosen month's last
# instant. The dialog reads the number with `page: { first: 1 }`, and the ids
# with no page when staff confirm (the server sets no maximum page size). The
# top-level `type` pins the type and the permission, as for the list above.
query prescriptionsToVerify(
  $storeId: String!
  $pickedUpTo: DateTime!
  $page: PaginationInput
) {
  invoices(
    storeId: $storeId
    filter: {
      status: { equalTo: PICKED }
      pickedDatetime: { beforeOrEqualTo: $pickedUpTo }
    }
    page: $page
    type: [PRESCRIPTION]
  ) {
    ... on InvoiceConnector {
      totalCount
      nodes {
        id
      }
    }
  }
}

# Verifies every record in one transaction: `continueOnError` is left unset
# (false), so one refusal verifies none. As for the bulk delete, the response
# then still reports success for the rows it rolled back (contract wire trap),
# so any error in it means nothing was verified.
mutation verifyPrescriptions(
  $storeId: String!
  $updates: [UpdatePrescriptionInput!]!
) {
  batchPrescription(
    storeId: $storeId
    input: { updatePrescriptions: $updates }
  ) {
    updatePrescriptions {
      id
      response {
        __typename
      }
    }
  }
}
