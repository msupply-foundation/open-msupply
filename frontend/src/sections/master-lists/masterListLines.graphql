# A master list's item-membership lines (spec/master-lists S2). The list is
# selected by the masterListId ARGUMENT — never a filter field, which the service
# silently overwrites with the argument (contract wire trap). Sort is by the
# item's name/code (last entry wins, same trap). Each row's code/name/unit render
# from the joined item; a line is membership only (no quantity/order data).
query masterListLines(
  $storeId: String!
  $masterListId: String!
  $sort: [MasterListLineSortInput!]
  $page: PaginationInput
) {
  masterListLines(
    storeId: $storeId
    masterListId: $masterListId
    sort: $sort
    page: $page
  ) {
    ... on MasterListLineConnector {
      __typename
      totalCount
      nodes {
        id
        item {
          id
          code
          name
          unitName
        }
      }
    }
  }
}
