# Synchronisation settings (spec/settings/contract.md § Synchronisation).
# The query never returns the password — the form's password field always
# starts blank (OMS-REG-SET-02.12).
query syncSettings {
  syncSettings {
    url
    username
    intervalSeconds
    batchSize
    isPaused
  }
}

# The pause switch has its own mutation so flipping it never re-sends the
# credentials the form holds (spec/settings/contract.md § Synchronisation).
mutation setSyncPaused($paused: Boolean!) {
  setSyncPaused(paused: $paused) {
    isPaused
  }
}

# Success returns the settings themselves (no dedicated OK wrapper); failure is
# one of the two sync-era error nodes. The V7 node's variant is aliased apart
# from the V6 one, matching src/api/initialisation.graphql, so the generated
# union keeps both enums distinct.
mutation updateSyncSettings($input: SyncSettingsInput!) {
  updateSyncSettings(input: $input) {
    ... on SyncSettingsNode {
      __typename
      username
    }
    ... on SyncErrorNode {
      __typename
      variant
      fullError
    }
    ... on SyncErrorV7Node {
      __typename
      variantV7: variant
      fullError
    }
  }
}
