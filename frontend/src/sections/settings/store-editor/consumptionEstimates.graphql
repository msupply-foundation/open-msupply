# The store editor's Consumption estimates tab (spec/settings/rules.md § The
# store editor › Consumption estimates). `storeId` is the signed-in store the
# request is authorised against; `forStoreId` the store being edited, which
# from the facility register is another store.
query consumptionEstimates($storeId: String!, $forStoreId: String!) {
  consumptionEstimates(storeId: $storeId, forStoreId: $forStoreId) {
    amcLookBackMonths
    siteSyncsOverV5V6
    estimates {
      itemId
      item {
        id
        code
        name
      }
      month
      quantity
    }
  }
}

# The rows of a blank upload template: the active stock items visible in the
# store being edited. Fetched only when the template is downloaded.
query consumptionEstimateTemplateItems(
  $storeId: String!
  $forStoreId: String!
) {
  consumptionEstimates(storeId: $storeId, forStoreId: $forStoreId) {
    templateItems {
      code
      name
    }
  }
}

# Gives each item named exactly the periods sent for it, and each item in
# `clearedItems` none; items not named are left alone, and unchanged periods
# aren't rewritten. `removedItems` are the cleared items that had estimates.
# `dryRun` checks the lines and reports which already have real consumption,
# without saving. A line problem saves nothing.
mutation replaceConsumptionEstimates(
  $storeId: String!
  $input: ReplaceConsumptionEstimatesInput!
) {
  centralServer {
    preferences {
      replaceConsumptionEstimates(storeId: $storeId, input: $input) {
        __typename
        ... on ReplaceConsumptionEstimatesNode {
          overlaps {
            line
            actualQuantity
          }
          removedItems
        }
        ... on ConsumptionEstimateLinesError {
          errors {
            line
            problem
            otherLine
          }
          removedItems
        }
      }
    }
  }
}

# Removes all of the store's estimates.
mutation clearConsumptionEstimates($storeId: String!, $forStoreId: String!) {
  centralServer {
    preferences {
      clearConsumptionEstimates(storeId: $storeId, forStoreId: $forStoreId) {
        __typename
      }
    }
  }
}
