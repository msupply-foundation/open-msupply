# The store editor's facility record (spec/settings/contract.md § The store
# editor). There is no singular name query — the record is fetched by filtering
# `names` on the store's own name id. `properties` is a JSON STRING keyed by
# property key; the server fabricates "{}" for a facility whose properties were
# never set, so "never set" and "explicitly empty" are indistinguishable here.
query storeFacility($storeId: String!, $nameId: String!) {
  names(storeId: $storeId, filter: { id: { equalTo: $nameId } }) {
    ... on NameConnector {
      __typename
      nodes {
        id
        name
        code
        properties
      }
    }
  }
}

# Wholesale write: `properties` replaces the name row's whole document, and an
# omitted/null value ERASES the stored set — so the client always sends the
# complete document (contract § The store editor, wire traps). Success is the
# NameNode itself; the typed error's only reachable member is RecordNotFound. A
# permission failure never reaches this union — it arrives as a top-level
# Forbidden GraphQL error, which the caller opts into reading
# (returnGraphqlErrors) so the editor can keep the draft (D79).
mutation updateNameProperties(
  $storeId: String!
  $id: String!
  $properties: String!
) {
  updateNameProperties(
    storeId: $storeId
    input: { id: $id, properties: $properties }
  ) {
    ... on NameNode {
      __typename
      id
      properties
    }
    ... on UpdateNamePropertiesError {
      __typename
      error {
        description
      }
    }
  }
}

# The store's 23 preference descriptions, served in the order the panel shows
# them (contract § The store editor). The server fabricates a default for an
# unset preference — there is no is-set flag — and `value` is untyped JSON
# (the schema's own declared type loss).
query storePreferences($storeId: String!) {
  preferenceDescriptions(
    storeId: $storeId
    prefType: STORE
    prefContext: { storeId: $storeId }
  ) {
    key
    valueType
    value
  }
}

# Per-preference write (unlike the wholesale properties save): each staged
# preference rides as a one-element `{ storeId, value }` array naming the
# edited store — the server honours the ids INSIDE the payload, not the
# auth-checked top-level one (contract § The store editor, wire traps).
# Central-server-only (the centralServer root gate), EDIT_CENTRAL_DATA;
# a bare OkResponse with no error union, so a failure is a top-level GraphQL
# error the caller opts into reading (returnGraphqlErrors), keeping the draft.
mutation upsertStorePreferences(
  $storeId: String!
  $input: UpsertPreferencesInput!
) {
  centralServer {
    preferences {
      upsertPreferences(storeId: $storeId, input: $input) {
        ok
      }
    }
  }
}
