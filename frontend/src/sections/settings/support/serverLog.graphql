# Server-log viewer (spec/settings/contract.md § Support). Both queries return
# the same LogNode shape; each populates only the field it's for. Viewing never
# changes anything (rules § Support). The database download is REST, not GraphQL — see
# SupportSection.tsx.
query logFileNames {
  logFileNames {
    fileNames
  }
}

query logContents($fileName: String) {
  logContents(fileName: $fileName) {
    fileContent
  }
}
