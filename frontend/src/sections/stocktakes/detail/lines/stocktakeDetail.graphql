# A single stocktake (info only) for the detail view. The stocktake-level fields feed the page
# header (number / status / description / comment), the status footer and the side panel. The
# LINES are NOT selected here — they come from the separate, server-paginated `stocktakeLines`
# query below (kdd/stocktake-line-editing: the detail table is server sorted / filtered / paged,
# not client-side over a whole-connection fetch). StocktakeResponse is StocktakeNode | NodeError;
# the view promotes NodeError to the global error modal.
#
# The stocktake-level fields the detail view reads AND edits: the header (number/status/
# description), the status footer (status/isLocked/finalisedDatetime), and the Additional-info
# side panel (comment/countedBy/verifiedBy/stocktakeDate). The SAME fragment is what
# updateStocktake returns, so a stocktake-level save reflects in place with no refetch
# (kdd/state-management) — the one exception being `lines`, fetched only by the detail query.
fragment StocktakeInfo on StocktakeNode {
  id
  stocktakeNumber
  status
  description
  comment
  isLocked
  countedBy
  verifiedBy
  stocktakeDate
  finalisedDatetime
  # Read-only "Entered by" / "Created" in the Additional-info side panel.
  createdDatetime
  user {
    username
  }
}

# ONE fragment, both directions (kdd/state-management): the same StocktakeLine fragment is the
# detail row AND what the batch mutation returns on insert/update, so a saved node splices back
# into the rows with no remapping and no refetch.
fragment StocktakeLine on StocktakeLineNode {
  id
  itemName
  item {
    id
    code
  }
  # The stock line this stocktake line counts (if any). The editor passes these ids as
  # excludeStockLineIds to stockLinesByItem, so a batch already on the stocktake isn't offered
  # for opt-in twice.
  stockLine {
    id
  }
  batch
  expiryDate
  # manufactureDate lets the editor set/clear a manufacture date (OMS parity).
  manufactureDate
  snapshotNumberOfPacks
  countedNumberOfPacks
  packSize
  sellPricePerPack
  costPricePerPack
  comment
  note
  # The line's location (a store-scoped lookup drives the picker; we show its code/name).
  location {
    id
    code
    name
  }
  # The inventory-adjustment reason (why counted differs from snapshot). reasonOption is the
  # current field; inventoryAdjustmentReason is deprecated. Selected via reasonOptionId on save.
  reasonOption {
    id
    type
    reason
  }
}

query stocktakeDetail($storeId: String!, $stocktakeId: String!) {
  stocktake(storeId: $storeId, id: $stocktakeId) {
    __typename
    ... on StocktakeNode {
      ...StocktakeInfo
    }
    ... on NodeError {
      error {
        __typename
        description
      }
    }
  }
}

# The detail table's rows: one server-paginated / filtered / sorted page of a stocktake's lines.
# A DIFFERENT query from `stocktakeDetail` (which is info-only) so the two refetch independently —
# a stocktake-level save (description/hold/finalise) never re-pulls the lines, and a line save
# refetches only the current page (kdd/stocktake-line-editing). Same `StocktakeLine` fragment the
# batch mutation returns, so nothing is remapped. filter/sort/page conform to the generated input
# types (kdd/type-safety) — the URL query state carries them verbatim.
#
# The line-edit modal also uses this query with `filter: { itemId }` to load one item's existing
# lines (it self-queries rather than being fed lines as props).
query stocktakeLines(
  $storeId: String!
  $stocktakeId: String!
  $page: PaginationInput
  $filter: StocktakeLineFilterInput
  $sort: [StocktakeLineSortInput!]
) {
  stocktakeLines(
    storeId: $storeId
    stocktakeId: $stocktakeId
    page: $page
    filter: $filter
    sort: $sort
  ) {
    ... on StocktakeLineConnector {
      __typename
      totalCount
      nodes {
        ...StocktakeLine
      }
    }
  }
}

# The one save call for the line editor: insert (new batches), update (edited existing lines),
# delete (removed lines) in a single batchStocktake mutation. Insert/update success returns the
# SAME StocktakeLine fragment as a detail row (spliced back with no refetch); delete returns the
# id. Errors are per-line (each array element carries its own response union).
mutation batchStocktakeLines(
  $storeId: String!
  $insert: [InsertStocktakeLineInput!]
  $update: [UpdateStocktakeLineInput!]
  $delete: [DeleteStocktakeLineInput!]
) {
  batchStocktake(
    storeId: $storeId
    input: {
      insertStocktakeLines: $insert
      updateStocktakeLines: $update
      deleteStocktakeLines: $delete
    }
  ) {
    insertStocktakeLines {
      id
      response {
        __typename
        ... on StocktakeLineNode {
          ...StocktakeLine
        }
        ... on InsertStocktakeLineError {
          # Inline fragments on each concrete error type so codegen narrows error.__typename to a
          # discriminated union (not a bare string). These are the InsertStocktakeLineErrorInterface
          # implementers; `description` stays as the fallback for any we don't map.
          error {
            __typename
            description
            ... on StockLineReducedBelowZero {
              __typename
            }
            ... on AdjustmentReasonNotProvided {
              __typename
            }
            ... on AdjustmentReasonNotValid {
              __typename
            }
            ... on CannotEditStocktake {
              __typename
            }
          }
        }
      }
    }
    updateStocktakeLines {
      id
      response {
        __typename
        ... on StocktakeLineNode {
          ...StocktakeLine
        }
        ... on UpdateStocktakeLineError {
          # UpdateStocktakeLineErrorInterface implementers (adds the snapshot mismatch that only
          # update/finalise raise). See the insert selection for why the inline fragments are here.
          error {
            __typename
            description
            ... on StockLineReducedBelowZero {
              __typename
            }
            ... on AdjustmentReasonNotProvided {
              __typename
            }
            ... on AdjustmentReasonNotValid {
              __typename
            }
            ... on SnapshotCountCurrentCountMismatchLine {
              __typename
            }
            ... on CannotEditStocktake {
              __typename
            }
          }
        }
      }
    }
    deleteStocktakeLines {
      id
      response {
        __typename
        ... on DeleteResponse {
          id
        }
        ... on DeleteStocktakeLineError {
          # DeleteStocktakeLineErrorInterface has one implementer. See the insert selection above.
          error {
            __typename
            description
            ... on CannotEditStocktake {
              __typename
            }
          }
        }
      }
    }
  }
}

# Stocktake-level edits: the debounced field saves (description / comment / countedBy /
# verifiedBy / stocktakeDate), the on-hold toggle (isLocked), and Finalise (status: FINALISED).
# One mutation for all of them — success returns the StocktakeInfo fragment, spliced back with no
# refetch. The FINALISE path can fail with line-level validation: SnapshotCountCurrentCountMismatch
# carries the mismatched stocktakeLine ids (so the error-summary dialog can offer "filter to the
# error lines"); StockLinesReducedBelowZero / StocktakeIsLocked / CannotEditStocktake are
# stocktake-wide messages (the dialog shows the message with no line filter).
mutation updateStocktake($storeId: String!, $input: UpdateStocktakeInput!) {
  updateStocktake(storeId: $storeId, input: $input) {
    __typename
    ... on StocktakeNode {
      ...StocktakeInfo
    }
    ... on UpdateStocktakeError {
      error {
        __typename
        description
        ... on SnapshotCountCurrentCountMismatch {
          lines {
            description
            stocktakeLine {
              id
            }
          }
        }
      }
    }
  }
}

# The item's stock lines in the store NOT already on the stocktake (its "available batches" to
# opt into the count), for the line-edit modal: the modal offers EVERY other batch of the item —
# including ones in other locations that a location-filtered stocktake didn't auto-include —
# matching OMS. `excludeStockLineIds` are the stock lines the stocktake already counts, filtered
# out server-side (id notEqualAll) so they aren't offered twice. hasPacksInStore drops empty
# stock lines. The fields mirror what seeds a draft line (snapshot = totalNumberOfPacks);
# location is the full node so the picker shows code/name.
query stockLinesByItem(
  $storeId: String!
  $itemId: String!
  $excludeStockLineIds: [String!]
) {
  stockLines(
    storeId: $storeId
    filter: {
      itemId: { equalTo: $itemId }
      hasPacksInStore: true
      id: { notEqualAll: $excludeStockLineIds }
    }
  ) {
    ... on StockLineConnector {
      __typename
      totalCount
      nodes {
        id
        batch
        expiryDate
        manufactureDate
        packSize
        costPricePerPack
        sellPricePerPack
        totalNumberOfPacks
        note
        location {
          id
          code
          name
        }
      }
    }
  }
}
