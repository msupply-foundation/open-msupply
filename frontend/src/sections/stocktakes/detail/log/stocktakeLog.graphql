# The stocktake detail view's "Log" tab: the activity-log entries for THIS stocktake, its own
# server-paginated query (kdd/state-management), independent of the header (stocktakeDetail) and
# the line table (stocktakeLines) — the Log tab refetches on its own without touching either.
#
# The log is scoped to one record via `filter: { recordId: { equalTo: <stocktakeId> } }` — every
# entry the backend has written against this stocktake (created / edited / finalised, plus the
# stock-level changes its lines produced). Sorted by `id` descending so the most recent entry is
# first (activity-log ids are monotonic; the upstream OMS app orders the same way). `to`/`from`
# carry the change detail (a scalar or a JSON blob) surfaced in the Details column; `type` maps to
# a `log.*` translation key (Formatter.logTypeTranslation parity: TYPE → `log.<kebab>`).
fragment StocktakeLog on ActivityLogNode {
  id
  datetime
  type
  to
  from
  user {
    username
  }
}

query stocktakeLog(
  $storeId: String!
  $recordId: String!
  $page: PaginationInput
  $sort: [ActivityLogSortInput!]
) {
  activityLogs(
    storeId: $storeId
    filter: { recordId: { equalTo: $recordId } }
    page: $page
    sort: $sort
  ) {
    ... on ActivityLogConnector {
      __typename
      totalCount
      nodes {
        ...StocktakeLog
      }
    }
  }
}
