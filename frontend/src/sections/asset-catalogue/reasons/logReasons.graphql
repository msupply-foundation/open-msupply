# The log-reasons list (spec/asset-catalogue S3): every live reason in one read
# (no page), unsorted — the list orders it by the translated status name, which
# the server's status sort (enum text) matches only in English.
# `storeId` is required and ignored (contract § log reasons).
query assetLogReasons($storeId: String!, $filter: AssetLogReasonFilterInput) {
  assetLogReasons(storeId: $storeId, filter: $filter) {
    ... on AssetLogReasonConnector {
      __typename
      totalCount
      nodes {
        id
        assetLogStatus
        reason
        commentsRequired
      }
    }
  }
}

# Create / delete. Every real refusal of both is a top-level error; the union
# error branches are never returned.
mutation insertAssetLogReason($input: InsertAssetLogReasonInput!) {
  centralServer {
    logReason {
      insertAssetLogReason(input: $input) {
        __typename
        ... on AssetLogReasonNode {
          id
        }
      }
    }
  }
}

mutation deleteLogReason($id: String!) {
  centralServer {
    logReason {
      deleteLogReason(reasonId: $id) {
        __typename
        ... on DeleteResponse {
          id
        }
      }
    }
  }
}
