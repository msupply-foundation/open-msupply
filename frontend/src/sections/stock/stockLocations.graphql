# The store's locations for this vertical's three location fields — the detail
# screen (S2), the new-stock modal (S3) and the repack modal's new location (S5).
# All three PLACE stock at a location, so all three use the volume-aware picker
# (spec/stock/rules.md › location fields: which picker where): hence `onHold` /
# `volume` / `volumeUsed` / `stock.totalCount` for its "% used" and its
# All / Empty / Available filter. `locationType` is stock's own addition — the
# picker is narrowed to the item's restricted location type when the item sets
# one — which is why this vertical reads its own shape rather than the domain's
# locationsWithVolume. `volumeUsed` is server-computed and shifts as stock moves,
# so each consuming view re-reads it rather than caching (spec/stock/contract.md
# › consumed reads).
query stockLocations($storeId: String!) {
  locations(storeId: $storeId) {
    ... on LocationConnector {
      __typename
      nodes {
        id
        code
        name
        onHold
        volume
        volumeUsed
        stock {
          ... on StockLineConnector {
            __typename
            totalCount
          }
        }
        locationType {
          id
        }
      }
    }
  }
}
