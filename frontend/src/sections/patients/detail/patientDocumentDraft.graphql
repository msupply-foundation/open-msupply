# The patient document's draft, which the Details tab edits from on the
# document path (patientDocumentEditor.ts): the document's latest version with
# any later changes to the name row merged in (made by legacy mSupply or a
# plain-path edit elsewhere). Its own query, read only there: the server
# parses the stored document to build it, so a document it cannot read fails
# this alone, never the patient screen, and a store on the plain path never
# asks.
query patientDocumentDraft($storeId: String!, $patientId: String!) {
  patient(storeId: $storeId, patientId: $patientId) {
    id
    documentDraft
  }
}
