# One patient by id (spec/patients S3 detail). `name` is the derived
# "{last}, {first}" display name; `age` is server-derived from dateOfBirth.
# address2/country/email/website are read here but are NOT writable via the
# plain path (spec/patients contract › editing wire trap) — only the document
# path projects them. customFields is re-filtered server-side to the "patient"
# scope's visible keys. On the document path (a Patient registry entry is
# installed) the Details tab edits the patient document instead: `document`
# names its latest version, and `documentDraft` is that version's data with
# any later changes to the name row merged in (made by legacy mSupply or a
# plain-path edit elsewhere), which is what an edit seeds from. Both are null
# for a patient that has no document yet.
query patient($storeId: String!, $patientId: String!) {
  patient(storeId: $storeId, patientId: $patientId) {
    id
    name
    code
    code2
    firstName
    lastName
    gender
    dateOfBirth
    age
    phone
    address1
    address2
    country
    email
    website
    isDeceased
    dateOfDeath
    nextOfKinId
    nextOfKinName
    createdDatetime
    customFields
    nextOfKin {
      id
      name
    }
    document {
      __typename
      id
      name
    }
    documentDraft
  }
}
