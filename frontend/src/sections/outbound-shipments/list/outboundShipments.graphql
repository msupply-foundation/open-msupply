# Outbound shipments list view (spec/outbound-shipments S1). Filter / sort /
# pagination are the GraphQL input types so URL state maps straight onto them
# (kdd/type-safety). The server forces the store scope and excludes cancellation
# reversals (contract.md § the list).
#
# The top-level `type` argument does BOTH jobs, so it is the only type pin here.
# It selects the PERMISSION — the server authorises this read against
# OutboundShipmentQuery alone because it is named; omitted, it falls back to a
# deprecated combined resource demanding all six invoice query permissions at
# once. It also OVERWRITES `filter.type` server-side, so a `filter.type` sent
# alongside is dead weight (spec/navigation/contract.md § wire traps). A literal,
# not a variable: this query serves one screen pinned to one type, so no caller
# can forget it — and forgetting it would now widen the rows, not just the
# permission.
query outboundShipments(
  $storeId: String!
  $filter: InvoiceFilterInput
  $sort: [InvoiceSortInput!]
  $page: PaginationInput
) {
  invoices(
    storeId: $storeId
    filter: $filter
    sort: $sort
    page: $page
    type: [OUTBOUND_SHIPMENT]
  ) {
    ... on InvoiceConnector {
      __typename
      totalCount
      nodes {
        id
        otherPartyName
        status
        invoiceNumber
        createdDatetime
        theirReference
        comment
        colour
        pricing {
          totalAfterTax
        }
        # Custom-field VALUES (JSON object), scope-filtered — backs the
        # configured custom-field columns.
        customFields
      }
    }
  }
}

# Create a shipment for a customer (S2). The id is client-generated so the
# create can navigate to the new shipment. Typed rejections (OMS-REG-DIST-02.15) are
# selected so the modal can translate them; anything else is non-typed and goes
# to the global error modal.
mutation insertOutboundShipment(
  $storeId: String!
  $input: InsertOutboundShipmentInput!
) {
  insertOutboundShipment(storeId: $storeId, input: $input) {
    __typename
    ... on InvoiceNode {
      id
    }
    ... on InsertOutboundShipmentError {
      error {
        __typename
        description
      }
    }
  }
}

# Bulk delete from the list (OMS-REG-DIST-01.23/.24). Submitted for any
# selection — the client does not pre-screen deletability (issue #1134). Each
# id's response is a DeleteResponse or a typed error, and the batch is ATOMIC:
# the server runs it in one transaction with continue_on_error defaulting to
# false, so the first refusal rolls everything back and these per-row results
# come back describing what WOULD have happened. Each failed row's
# error.description is the reason shown.
mutation deleteOutboundShipments($storeId: String!, $ids: [String!]) {
  batchOutboundShipment(
    storeId: $storeId
    input: { deleteOutboundShipments: $ids }
  ) {
    deleteOutboundShipments {
      id
      response {
        __typename
        ... on DeleteResponse {
          id
        }
        ... on DeleteOutboundShipmentError {
          error {
            __typename
            description
          }
        }
      }
    }
  }
}

# Duplicate a shipment (OMS-REG-DIST-02.28/.29): any shipment (incl. SHIPPED) copies into a
# fresh NEW one whose stock lines became placeholders; inactive-catalogue items
# are skipped and counted.
mutation duplicateOutboundShipment($storeId: String!, $id: String!) {
  duplicateOutboundShipment(storeId: $storeId, id: $id) {
    __typename
    ... on DuplicateOutboundShipmentNode {
      invoice {
        id
      }
      skippedItemCount
    }
    ... on DuplicateOutboundShipmentError {
      error {
        __typename
        description
      }
    }
  }
}
