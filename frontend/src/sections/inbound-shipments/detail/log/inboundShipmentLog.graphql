# The inbound-shipment detail "Log" tab: activity-log entries for THIS shipment,
# its own server-paginated query (mirrors the stocktake log). Scoped by
# recordId; NO sort — `datetime` is not a sortable key on the wire and an id
# sort scrambles the chronology (ids are UUIDs), so we take the server's no-sort
# default (datetime ascending) and order for display client-side.
fragment InboundLog on ActivityLogNode {
  id
  datetime
  type
  to
  from
  user {
    username
  }
}

query inboundShipmentLog(
  $storeId: String!
  $recordId: String!
  $page: PaginationInput
) {
  activityLogs(
    storeId: $storeId
    filter: { recordId: { equalTo: $recordId } }
    page: $page
  ) {
    ... on ActivityLogConnector {
      __typename
      totalCount
      nodes {
        ...InboundLog
      }
    }
  }
}
