# Plugin discovery (spec/plugins/contract.md § discovery & loading): the
# installed frontend plugins for this server — code, where the bundle is served,
# and a content hash of its bytes (the `?v=` cache-busting token).
#
# Unauthenticated and store-agnostic on the server, so the loader may run it as
# soon as a session exists and never has to wait for store context.
#
# `host` is how this app declares what it is and what it can load: the component
# runtime a bundle's contributions must target, plus the same two integers the
# loader gates on locally. One server serves several hosts at once (this app at
# `/`, the old React UI at `/old-ui/`), so it cannot work out per server which
# bundles the caller can load — omitting `host` means the React UI as it shipped
# before any of this existed. Sending ours is what stops us being offered a
# bundle we would fetch, evaluate, and only then refuse.
query frontendPluginMetadata($host: HostPluginApiInput) {
  frontendPluginMetadata(host: $host) {
    code
    path
    hash
  }
}
