# The plugin system's own wire surface (spec/plugins/contract.md): discovery of
# the installed frontend bundles, and the generic plugin-data store the SDK
# exposes to plugins. No plugin ships its own operations for these — the host
# owns them so a plugin never reaches past the SDK
# (spec/plugins/sdk-contract.md § data access).
#
# `frontendPluginMetadata` is unscoped (no storeId): code + path + content hash,
# the hash being the ?v= cache token (contract § caching & updates).
query frontendPluginMetadata {
  frontendPluginMetadata {
    code
    path
    hash
  }
}

# Plugin data reads are always (pluginCode, storeId)-scoped by the SDK; the
# filter is the plugin's (identifier + optional related record).
query pluginData(
  $storeId: String!
  $pluginCode: String!
  $filter: PluginDataFilterInput
) {
  pluginData(storeId: $storeId, pluginCode: $pluginCode, filter: $filter) {
    ... on PluginDataConnector {
      totalCount
      nodes {
        id
        pluginCode
        relatedRecordId
        dataIdentifier
        storeId
        data
        datetime
      }
    }
  }
}

# Both writes union to PluginDataNode alone — there is no error branch on the
# wire, so a failure can only arrive as a GraphQL error (contract § plugin data).
mutation insertPluginData($storeId: String!, $input: InsertPluginDataInput!) {
  insertPluginData(storeId: $storeId, input: $input) {
    ... on PluginDataNode {
      id
      data
      dataIdentifier
      relatedRecordId
      datetime
    }
  }
}

mutation updatePluginData($storeId: String!, $input: UpdatePluginDataInput!) {
  updatePluginData(storeId: $storeId, input: $input) {
    ... on PluginDataNode {
      id
      data
      dataIdentifier
      relatedRecordId
      datetime
    }
  }
}
