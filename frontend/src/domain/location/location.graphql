# Locations for the current store, two shapes for two picker roles (see
# spec/ui-standards/components.md → Location lookup — plain vs volume-aware).
#
# `locations` — code + name only. Backs the volume-BLIND picker (LocationSelect),
# used where a location is merely referenced (scoping a stocktake count, a list
# filter). No capacity fetched.
query locations($storeId: String!) {
  locations(storeId: $storeId) {
    ... on LocationConnector {
      __typename
      nodes {
        id
        code
        name
      }
    }
  }
}

# `locationsWithVolume` — additionally `onHold` / `volume` / `volumeUsed` /
# `stock.totalCount`. Backs the volume-AWARE picker (LocationVolumeSelect), used
# where stock is associated with a location (stocktake / inbound line editor,
# bulk change-location): it shows each location's % used and offers the
# All / Empty / Available fullness filter — where "Available" means not on-hold
# and not full, hence `onHold`. `volumeUsed` is the server-computed sum of
# `volumePerPack × packs` over the location's stock, so it must be re-read where
# volume is shown rather than cached — the consuming route/view fetches this
# locally and passes it down.
query locationsWithVolume($storeId: String!) {
  locations(storeId: $storeId) {
    ... on LocationConnector {
      __typename
      nodes {
        id
        code
        name
        onHold
        volume
        volumeUsed
        stock {
          ... on StockLineConnector {
            __typename
            totalCount
          }
        }
      }
    }
  }
}
