# Locations for the current store, two shapes for two picker roles (see
# spec/ui-standards/components.md → Location lookup — plain vs volume-aware).
#
# BOTH sort by name, explicitly: absent a sort the server orders locations by
# `id` — a UUID, so the picker's options arrive in an order no user can read
# (repository/src/db_diesel/location.rs). Every surface that lists locations
# wants them alphabetical, so the sort belongs here rather than at each caller.
#
# `locations` — code, name and storage type. Backs the volume-BLIND picker
# (LocationSelect), used where a location is merely referenced (scoping a
# stocktake count, a list filter). No capacity fetched. The type is named
# because a picker that offers cold storage must say WHAT each place is —
# `+5°C` alone does not distinguish a fridge from a cold room.
#
# The optional `filter` is for callers that need a narrower set than "every
# location in the store": cold-chain Equipment asks for the ones no asset holds
# (`assignedToAsset: false`), because a storage location is held by at most one
# asset. Omitted, the read is exactly what it always was.
query locations($storeId: String!, $filter: LocationFilterInput) {
  locations(storeId: $storeId, filter: $filter, sort: [{ key: name }]) {
    ... on LocationConnector {
      __typename
      nodes {
        id
        code
        name
        locationType {
          id
          name
        }
      }
    }
  }
}

# `locationsWithVolume` — additionally `onHold` / `volume` / `volumeUsed` /
# `stock.totalCount`. Backs the volume-AWARE picker (LocationVolumeSelect), used
# where stock is associated with a location (stocktake / inbound line editor,
# bulk change-location): it shows each location's % used and offers the
# All / Empty / Available fullness filter — where "Available" means not on-hold
# and with room for the volume being placed, hence `onHold`. `volumeUsed` is the
# server-computed sum of
# `volumePerPack × packs` over the location's stock, so it must be re-read where
# volume is shown rather than cached — the consuming route/view fetches this
# locally and passes it down.
query locationsWithVolume($storeId: String!) {
  locations(storeId: $storeId, sort: [{ key: name }]) {
    ... on LocationConnector {
      __typename
      nodes {
        id
        code
        name
        onHold
        volume
        volumeUsed
        # The storage type, for pickers that must honour an item's restricted
        # location type (the stock-movement destination — its rules § lines).
        # Named as well as identified, so this shape stays a superset of the
        # plain one above — the two are passed to the same pickers.
        locationType {
          id
          name
        }
        stock {
          ... on StockLineConnector {
            __typename
            totalCount
          }
        }
      }
    }
  }
}
