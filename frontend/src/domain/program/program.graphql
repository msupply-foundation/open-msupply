# Program-enrolment document registries for the current store — the option
# source of the patient-program picker (spec/reports contract "Arguments",
# AC-R10). One registry per program the caller may see: the server restricts
# results to contexts the user holds a document permission for. The submitted
# argument value is `contextId` (the program's context), not the registry id.
query programRegistries($storeId: String!) {
  documentRegistries(
    storeId: $storeId
    filter: { category: { equalTo: PROGRAM_ENROLMENT } }
    sort: [{ key: documentType }]
  ) {
    ... on DocumentRegistryConnector {
      __typename
      nodes {
        id
        name
        documentType
        contextId
      }
    }
  }
}

# The store's visible programs, sorted by name — the option source of the
# report argument PROGRAM picker (spec/reports contract "Arguments", AC-R12;
# distinct from the enrolment-registry picker above). isImmunisation is
# selected so an immunisation-only field filters client-side from the same
# fetch. The picker submits the program's id (plus the elmisCode /
# fetchAllPrograms companion writes — see the contract).
query programs($storeId: String!) {
  programs(
    storeId: $storeId
    page: { first: 1000 }
    filter: { existsForStoreId: { equalTo: $storeId } }
    sort: { key: name }
  ) {
    ... on ProgramConnector {
      __typename
      nodes {
        id
        name
        elmisCode
        isImmunisation
      }
    }
  }
}

# Periods that have already begun (startDate <= the given day), optionally
# narrowed to a program — the option source of the report argument PERIOD
# picker (spec/reports contract "Arguments", AC-R16). $today is the viewer's
# current calendar date; the query has no sort input (server default order).
query periods($storeId: String!, $programId: String, $today: NaiveDate!) {
  periods(
    storeId: $storeId
    programId: $programId
    page: { first: 100 }
    filter: { startDate: { beforeOrEqualTo: $today } }
  ) {
    ... on PeriodConnector {
      __typename
      nodes {
        id
        name
        startDate
        endDate
      }
    }
  }
}

# A program's period schedules, each with its CLOSED periods (ended on or
# before today — server-enforced) — the schedule + period steps of the report
# argument schedule cascade (spec/reports contract "Arguments", AC-R17). A
# consumed read owned by R&R forms.
query schedulesWithPeriods($storeId: String!, $programId: String!) {
  schedulesWithPeriodsByProgram(storeId: $storeId, programId: $programId) {
    ... on PeriodSchedulesConnector {
      __typename
      nodes {
        id
        name
        periods {
          id
          period {
            id
            name
            startDate
            endDate
          }
        }
      }
    }
  }
}
