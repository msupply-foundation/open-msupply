# Program-enrolment document registries for the current store — the option
# source of the patient-program picker (spec/reports contract "Arguments",
# AC-R10). One registry per program the caller may see: the server restricts
# results to contexts the user holds a document permission for. The submitted
# argument value is `contextId` (the program's context), not the registry id.
query programRegistries($storeId: String!) {
  documentRegistries(
    storeId: $storeId
    filter: { category: { equalTo: PROGRAM_ENROLMENT } }
    sort: [{ key: documentType }]
  ) {
    ... on DocumentRegistryConnector {
      __typename
      nodes {
        id
        name
        documentType
        contextId
      }
    }
  }
}

# The store's visible programs, sorted by name — the option source of the
# report argument PROGRAM picker (spec/reports contract "Arguments", AC-R12;
# distinct from the enrolment-registry picker above). isImmunisation is
# selected so an immunisation-only field filters client-side from the same
# fetch. The picker submits the program's id (plus the elmisCode /
# fetchAllPrograms companion writes — see the contract).
query programs($storeId: String!) {
  programs(
    storeId: $storeId
    page: { first: 1000 }
    filter: { existsForStoreId: { equalTo: $storeId } }
    sort: { key: name }
  ) {
    ... on ProgramConnector {
      __typename
      nodes {
        id
        name
        elmisCode
        isImmunisation
      }
    }
  }
}
