# The invoice custom-field (properties v2) definitions for one scope
# (spec/prescriptions § custom fields). Not store-scoped — the definitions are
# global config; the value blob lives on each InvoiceNode.customFields. Each
# node carries the label (name), value type, prominence (displayMode), and the
# OPTION hierarchy needed to render and resolve a value.
query invoiceCustomFields($scope: String!) {
  customFields(filter: { scope: { equalTo: $scope } }) {
    ... on CustomFieldConnector {
      totalCount
      nodes {
        id
        key
        name
        valueType
        displayMode
        options {
          id
          key
          name
          parentOptionId
        }
      }
    }
  }
}
