# Stock items for the item-search selector (add-item flow), paginated for
# infinite scroll: one page at a time (first/offset), server-side filtered by
# codeOrName. type=STOCK + isActive/isVisibleOrOnHand mirror OMS's stock-item
# search; `id: { notEqualAll }` drops items already in the caller's context
# (e.g. already on the stocktake) so they aren't offered twice.
#
# The per-item stock figure is summed CLIENT-side from availableBatches (Σ
# availableNumberOfPacks * packSize — AVAILABLE stock, net of reservations, so it
# matches the line editor's Available line and the old app; totalNumberOfPacks
# would over-count by the reserved stock) rather than a server stat — the item
# stats field triggers an AMC calculation we don't need here, and the
# infinite-scroll loading strategy means only ~one page of items is summed at a time.
query itemsWithStock(
  $storeId: String!
  $filter: ItemFilterInput
  $page: PaginationInput
  $sort: [ItemSortInput!]
) {
  items(storeId: $storeId, filter: $filter, page: $page, sort: $sort) {
    ... on ItemConnector {
      __typename
      totalCount
      nodes {
        id
        code
        name
        unitName
        # isVaccine/doses let a consumer that counts vaccines in doses
        # (spec/stocktakes › store-preference gates) carry the per-item doses
        # factor from the picker straight onto a new line, without a re-fetch.
        isVaccine
        doses
        # defaultPackSize + the store's default sell price prefill a new inbound
        # line's pack size, cost price, and sell price (spec/inbound-shipments
        # AC-H6), carried from the picker onto the line without a re-fetch.
        defaultPackSize
        itemStoreProperties(storeId: $storeId) {
          defaultSellPricePerPack
        }
        availableBatches(storeId: $storeId) {
          ... on StockLineConnector {
            __typename
            nodes {
              id
              availableNumberOfPacks
              packSize
            }
          }
        }
      }
    }
  }
}
