# The document form host's reads and writes (kdd/custom-forms/specs.md § Forms
# in the UI). A document carries the registry entry for its type, whose
# formSchemaId and jsonSchema are the CURRENT schema: the one a form validates
# against and a save pins the new version to. `schema` is the version this
# document was pinned to when it was written, with its JSON Schema: a document
# pinned to an earlier version is shown against its own schema (its archived
# form reads that version's formats and allowed values).

fragment FormRegistry on DocumentRegistryNode {
  __typename
  id
  documentType
  category
  contextId
  name
  formSchemaId
  jsonSchema
}

fragment FormDocument on DocumentNode {
  __typename
  id
  name
  type
  data
  schema {
    __typename
    id
    jsonSchema
  }
  documentRegistry {
    ...FormRegistry
  }
}

# The latest version of one document, by its name. Null when the document
# does not exist or lies outside the caller's allowed contexts.
query formDocumentByName($storeId: String!, $name: String!) {
  document(storeId: $storeId, name: $name) {
    ...FormDocument
  }
}

# The registry entries the caller may see in this store: the server returns
# only entries whose context the user holds a document permission for.
query formRegistries($storeId: String!, $filter: DocumentRegistryFilterInput) {
  documentRegistries(
    storeId: $storeId
    filter: $filter
    sort: [{ key: documentType }]
  ) {
    ... on DocumentRegistryConnector {
      __typename
      nodes {
        ...FormRegistry
      }
    }
  }
}

mutation insertFormProgramEnrolment(
  $storeId: String!
  $input: InsertProgramEnrolmentInput!
) {
  insertProgramEnrolment(storeId: $storeId, input: $input) {
    ... on ProgramEnrolmentNode {
      __typename
      id
      document {
        ...FormDocument
      }
    }
  }
}

mutation updateFormProgramEnrolment(
  $storeId: String!
  $input: UpdateProgramEnrolmentInput!
) {
  updateProgramEnrolment(storeId: $storeId, input: $input) {
    ... on ProgramEnrolmentNode {
      __typename
      id
      document {
        ...FormDocument
      }
    }
  }
}

mutation insertFormEncounter($storeId: String!, $input: InsertEncounterInput!) {
  insertEncounter(storeId: $storeId, input: $input) {
    ... on EncounterNode {
      __typename
