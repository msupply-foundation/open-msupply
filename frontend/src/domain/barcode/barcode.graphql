# Barcodes (spec/barcode-scanning/contract.md; decisions/2026-09-30_barcodes.md).
# A confirmed barcode is central's: shared by every site, and one barcode can be
# confirmed for several items. A proposal is a barcode a store learned, waiting
# for central. The server stores every barcode in its standard form, so the app
# sends a scan as it was read and never pads or trims it. `barcode` is the
# barcode as people read it; `value` is the stored form.

fragment Barcode on BarcodeMatchNode {
  id
  status
  value
  barcode
  itemId
  packSize
}

# What a scan matches: confirmed barcodes first, then proposals made on this
# site, one per item this store can see. An empty list is an unknown barcode —
# the normal first scan of a new product.
query barcodeMatches($storeId: String!, $barcode: String!) {
  barcodeMatches(storeId: $storeId, barcode: $barcode) {
    ...Barcode
  }
}

# Records that a user picked an item for a barcode in this store, for central to
# review. Sent once the line the scan opened is saved. Answers with the confirmed
# barcode instead when the barcode is already confirmed for the item.
# InvalidBarcode and InvalidItem are top-level GraphQL errors.
mutation proposeBarcode($storeId: String!, $input: ProposeBarcodeInput!) {
  proposeBarcode(storeId: $storeId, input: $input) {
    ...Barcode
  }
}

# Central only: confirmed barcodes. Every error is a top-level GraphQL error.
mutation insertBarcode(
  $storeId: String!
  $input: InsertConfirmedBarcodeInput!
) {
  centralServer {
    barcode {
      insertBarcode(storeId: $storeId, input: $input) {
        id
      }
    }
  }
}

mutation confirmBarcodeProposal($storeId: String!, $id: String!) {
  centralServer {
    barcode {
      confirmBarcodeProposal(storeId: $storeId, id: $id) {
        id
      }
    }
  }
}

mutation updateBarcode($storeId: String!, $input: UpdateBarcodeInput!) {
  centralServer {
    barcode {
      updateBarcode(storeId: $storeId, input: $input) {
        id
      }
    }
  }
}

# Withdraws a proposal made by a store on this site, e.g. one that picked the
# wrong item. It stops matching scans here, and central stops reviewing it. Not
# central only. ProposalDoesNotExist is a top-level GraphQL error.
mutation deleteBarcodeProposal($storeId: String!, $id: String!) {
  deleteBarcodeProposal(storeId: $storeId, id: $id) {
    id
  }
}

mutation deleteBarcode($storeId: String!, $id: String!) {
  centralServer {
    barcode {
      deleteBarcode(storeId: $storeId, id: $id) {
        id
      }
    }
  }
}
