# Spec (Store Login, Guard 3): one query for store preferences and the user's
# permissions in the store.
query storeContext($storeId: String!) {
  storePreferences(storeId: $storeId) {
    id
    packToOne
    # Inbound-shipment gates (spec/inbound-shipments › store-preference gates):
    # foreign-currency issuing and manual internal-order linking.
    issueInForeignCurrency
    manuallyLinkInternalOrderToInboundShipment
    omProgramModule
    vaccineModule
    # Threshold defaults the reports argument form seeds (spec/reports/rules
    # "Arguments" — defaults are client-seeded from store preferences).
    monthsOverstock
    monthsUnderstock
    monthsItemsExpire
    stocktakeFrequency
    monthlyConsumptionLookBackPeriod
    monthsLeadTime
  }
  # Typed preferences (PreferencesNode). The chrome sync indicator's count-badge
  # gate (spec/chrome § sync indicator); rides on guard 3 so the post-sync
  # refresh keeps it current. The three stocktake display gates
  # (spec/stocktakes › store-preference gates) ride here too — global state,
  # read by the detail line table, line editor, and create modal.
  preferences(storeId: $storeId) {
    syncRecordsDisplayThreshold
    manageVaccinesInDoses
    manageVvmStatusForStock
    allowTrackingOfStockByDonor
    # Outbound display/affordance gates (spec/outbound-shipments § store
    # preference gates) — same global PreferencesNode, read by the list filter,
    # status crumbs, line editor, and allocation policy.
    sortByVvmStatusThenExpiry
    expiredStockPreventIssue
    expiredStockIssueThreshold
    invoiceStatusOptions
    # Inbound-shipment gates (spec/inbound-shipments): procurement (from-PO
    # creation option), authorisation lock, and the backdating window.
    useProcurementFunctionality
    externalInboundShipmentLinesMustBeAuthorised
    backdating {
      shipmentsEnabled
      maxDays
    }
  }
  me {
    ... on UserNode {
      __typename
      userId
      permissions(storeId: $storeId) {
        nodes {
          storeId
          permissions
        }
      }
    }
  }
}
