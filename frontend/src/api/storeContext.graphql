# Spec (Store Login, Guard 3): one query for store preferences and the user's
# permissions in the store.
query storeContext($storeId: String!) {
  storePreferences(storeId: $storeId) {
    id
    packToOne
    omProgramModule
    vaccineModule
    # Threshold defaults the reports argument form seeds (spec/reports/rules
    # "Arguments" — defaults are client-seeded from store preferences).
    monthsOverstock
    monthsUnderstock
    monthsItemsExpire
    stocktakeFrequency
    monthlyConsumptionLookBackPeriod
    monthsLeadTime
  }
  # Typed preferences (PreferencesNode). The chrome sync indicator's count-badge
  # gate (spec/chrome § sync indicator); rides on guard 3 so the post-sync
  # refresh keeps it current. The stocktake AND stock display gates
  # (spec/stocktakes + spec/stock › store-preference gates) ride here too —
  # global state, read by the detail line table, line editor, create modal, and
  # the whole stock vertical (list/detail/new-stock/adjust).
  preferences(storeId: $storeId) {
    syncRecordsDisplayThreshold
    manageVaccinesInDoses
    manageVvmStatusForStock
    allowTrackingOfStockByDonor
    # spec/stock: the VVM status FIELD (S2/S3) shows when this OR
    # manageVvmStatusForStock is on; the adjust date control (S4) is gated on
    # backdating.inventoryAdjustmentsEnabled and bounded by maxDays.
    sortByVvmStatusThenExpiry
    backdating {
      inventoryAdjustmentsEnabled
      maxDays
    }
  }
  me {
    ... on UserNode {
      __typename
      userId
      permissions(storeId: $storeId) {
        nodes {
          storeId
          permissions
        }
      }
    }
  }
}
