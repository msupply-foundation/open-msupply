# Global table-config defaults, keyed by tableId, stored as a JSON blob in store
# preferences (a Record<tableId, TableConfig>). Cross-cutting — every list table
# reads it and narrows to its own tableId (see ui/elements/table/tableConfig.ts),
# so it lives in the shared api layer, not in any one vertical.
#
# Read-only here — this schema has no mutation to save it, so a user's own column
# changes persist to app data (localStorage); these API values are only the shared
# default a user's saved config layers on top of.
query globalTableConfigs($storeId: String!) {
  preferences(storeId: $storeId) {
    globalTableConfigs
  }
}
