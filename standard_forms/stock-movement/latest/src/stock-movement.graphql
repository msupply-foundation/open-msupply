query StockMovement($storeId: String!, $relocationIds: [String!]) {
  stockRelocations(
    storeId: $storeId
    filter: { id: { equalAny: $relocationIds } }
  ) {
    ... on StockRelocationConnector {
      totalCount
      nodes {
        id
        itemCode
        itemName
        batch
        expiryDate
        numberOfPacks
        fromPackSize
        toPackSize
        status
        createdDatetime
        fromLocation {
          code
          name
        }
        toLocation {
          code
          name
        }
      }
    }
  }
  store(id: $storeId) {
    ... on StoreNode {
      id
      code
      storeName
      logo
      name(storeId: $storeId) {
        address1
        address2
        phone
        email
      }
    }
  }
}
