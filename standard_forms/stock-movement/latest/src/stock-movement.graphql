query StockMovement($storeId: String!, $dataId: String!) {
  stockRelocation(storeId: $storeId, id: $dataId) {
    ... on StockRelocationNode {
      id
      stockMovementNumber
      status
      comment
      createdDatetime
      lineCount
      user {
        username
      }
      lines {
        nodes {
          id
          numberOfPacks
          stockLine {
            batch
            expiryDate
            packSize
            item {
              code
              name
            }
          }
          sourceLocation {
            code
            name
          }
          destinationLocation {
            code
            name
          }
        }
      }
    }
  }
  store(id: $storeId) {
    ... on StoreNode {
      id
      code
      storeName
      logo
      name(storeId: $storeId) {
        address1
        address2
        phone
        email
      }
    }
  }
}
