# Central server configuration.
#
# Shared between local development and the Docker Compose setup in
# docker/scripts/docker-compose.yml (where this file is bind-mounted over
# configuration/local.yaml inside the container).
#
# To load this file for local dev, point the server at it explicitly — APP_ENVIRONMENT only
# selects local.yaml or production.yaml, not this file:
#   cd server && cargo run -- --config-path configuration/central.yaml
#
# Layered on top of base.yaml. Env vars (APP_*) override everything.
#
# This central server stores its data in a PostgreSQL running on the HOST machine. It uses the
# -postgres image (the postgres-capable server binary) but does NOT start the image's embedded
# postgres — it connects to the host's postgres instead (see docker-compose.yml).
#
# The container joins the host network (network_mode: host in docker-compose.yml), so
# "localhost" below is the host's localhost: the same address dev (cargo run) uses, and
# the same Postgres instance is shared between dev and Docker.
server:
  host: 0.0.0.0
  port: 8000
  danger_allow_http: true # allow http in production mode
  # set server mode as central server; should only be used in testing, demo and development.
  # sync calls can override this back to normal.
  override_is_central_server: true
sync:
  url: "http://localhost:2048"
  username: "central"
  # 'd74ff0ee8da3b9806b18c877dbf29bbde50b5bd8e4dad7a3a725000feb82e8f1' = 'pass'
  password_sha256: "d74ff0ee8da3b9806b18c877dbf29bbde50b5bd8e4dad7a3a725000feb82e8f1"
  interval_seconds: 5
  batch_size:
    remote_push: 1024
    remote_pull: 10000
    central_pull: 10000
database:
  # Postgres running on the HOST machine. With host networking, "localhost" inside the
  # container is the host's localhost — the same Postgres dev (cargo run) connects to.
  host: "localhost"
  port: 5432
  username: "postgres"
  password: "password"
  database_name: "omsupply-central-test"
logging:
  # one of: All | Console | File
  mode: Console
  # one of: Error | Warn | Info (default) | Debug | Trace
  level: Info
backup: # see cli backup/restore
  backup_dir: "/backup" # Required, must be an absolute path
  max_number_of_backups: 10 # Optional, defaults to unlimited
