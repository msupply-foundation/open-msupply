# To use custom server settings for a local or a production environment create a copy
# of this example file and name it local.yaml or production.yaml, respectively.
# server:
#   host: 127.0.0.1
#   develop: true
#   port: 8000
#   # discovery: Enabled # Enabled, Disabled, or Auto
#   # debug_no_access_control: true # enable this if you want to ignore API authorisation (dummy user will be used for all operations)
#   # danger_allow_http: true # allow http in production mode
#   # override_is_central_server: true # set server mode as central server, should only be used in testing, demo and development, sync calls can override this back to normal
#   # # Setting all three values below on a fresh DB initialises OMS central and comment out sync settings.
#   # # Requires `override_is_central_server: true` above as well.
#   # standalone_store_name: 'Central Config'
#   # standalone_admin_username: 'admin'
#   # standalone_admin_password: 'pass'
#   # workers: 8 # number of actix-web worker threads; defaults to logical CPU count. Increase to reduce 408 timeouts under heavy load.
#   # # Auth timing hints exposed to clients via UserNode (both in seconds, advisory only)
#   # inactivity_timeout_seconds: 900 # inactive for this long -> client forces re-login
#   # token_refresh_interval_seconds: 60 # active but no API call for this long -> client pings refreshToken
#   cors_origins: [
#       http://localhost:3003,
#       https://demo-open.msupply.org,
#       http://localhost:8000,
#     ] # Used to set the allowed Origin in Cross Origin Request Security
#   base_dir: "app_data"
#   # Directory the web frontend is served from, relative to the working directory.
#   # Debug builds fall back to client/packages/host/dist when this doesn't exist.
#   frontend_dir: "frontend"
#   # The legacy ("old UI") frontend is served under /old-ui/ from the old-ui
#   # subdirectory of frontend_dir, when present (by convention - not configurable).
# sync:
#   # url/username/password_sha256/interval_seconds are all-or-nothing: set them all, or omit them
#   # all to carry only flags (e.g. on a central server). A partial set is a startup error.
#   url: "http://localhost:2048"
#   username: "demo"
#   # 'd74ff0ee8da3b9806b18c877dbf29bbde50b5bd8e4dad7a3a725000feb82e8f1' = 'pass'
#   password_sha256: "d74ff0ee8da3b9806b18c877dbf29bbde50b5bd8e4dad7a3a725000feb82e8f1"
#   interval_seconds: 300
#   batch_size:
#     remote_push: 1024
#     remote_pull: 500
#     central_pull: 500
#   # Set to true to disable the outer transaction during integration. This can prevent PostgreSQL
#   # from exhausting max_locks_per_transaction during large store migrations. Use with caution.
#   disable_integration_transaction: false
#   # Central server only. Relax the v7 hardware-id and "token already allocated" guards so a site
#   # can re-pair from a new machine without an admin reset (name + password still required). For
#   # recovery/migration only — leave false in normal operation.
#   relax_hardware_id_token_checks: false
# database:
#   host: "localhost"
#   port: 5432
#   username: "postgres"
#   password: "password"
#   database_name: "omsupply-database"
#   connection_pool_min_idle: 2
#   connection_pool_max_connections: 10
#   connection_pool_timeout_seconds: 30
# logging:
##   one of: All | Console | File
#   mode: Console
##   one of:  Error | Warn | Info (default) | Debug | Trace
#   level: Info
#   directory: log
#   filename: remote_server.log
#   max_file_count: 10
#   max_file_size: 1
# backup: # see cli backup/restore
#   backup_dir: "~/Documents/omSupply_backup"
#   pg_bin_dir: "/Applications/Postgres.app/Contents/Versions/16/bin"  # Optional
#   max_number_of_backups: 10  # Optional, defaults to unlimited
# mail: # required on Open mSupply Central Server only
#   host: "localhost"
#   #1025 is the default port for mailhog (https://github.com/mailhog/MailHog)
#   port: "1025"
#   starttls: false
#   username: ""
#   password: ""
#   from: "no-reply@msupply.foundation"
#   #  Can make this smaller for testing emails
#   interval: 60 # in seconds
# oidc: # OpenID Connect single sign-on (Keycloak). Omit the whole block to disable it.
#   # Realm issuer. Endpoints are read from {issuer}/.well-known/openid-configuration, and the
#   # ID token's `iss` claim must match this exactly.
#   issuer: "https://keycloak.example.org/realms/msupply"
#   client_id: "open-msupply"
#   # Only for confidential clients. Public clients are authenticated by PKCE alone.
#   # client_secret: "..."
#   # Must be registered verbatim as a valid redirect URI on the Keycloak client, and must point
#   # at this server's /auth/oidc/callback.
#   redirect_url: "https://oms.example.org/auth/oidc/callback"
#   # scopes: [openid, profile, email] # must include openid
#   #
#   # Which mSupply user_account the session runs as:
#   #   username_claim (default) - the person's own account; they must exist in mSupply, and their
#   #                              roles are matched to permission groups (see roles_claim below).
#   #   group                    - the account named by their GROUP, shared by everyone in it. The
#   #                              provider's users need not exist in mSupply, and no permissions
#   #                              are copied: the session IS that account. The trade is
#   #                              attribution - every action by everyone in the group is recorded
#   #                              against the one account.
#   # account_source: username_claim
#   #
#   # account_source: username_claim only --------------------------------------
#   # username_claim: preferred_username # matched (case-insensitively) against user_account.username
#   #
#   # Where that account's permissions come from:
#   #   roles (default) - Keycloak roles are matched to permission-group accounts and grant their
#   #                     permissions; a user whose roles match NO group is refused.
#   #   account         - the account's own mSupply permissions are the whole story. Keycloak only
#   #                     proves who you are; roles are not read, and grants left by an earlier
#   #                     'roles' sign-in are removed. Nothing extra to configure in Keycloak.
#   # permission_source: roles
#   #
#   # permission_source: roles only --------------------------------------------
#   # Dotted path to the roles claim. Keycloak realm roles live in realm_access.roles; client roles
#   # in resource_access.<client_id>.roles. NOTE Keycloak's built-in realm-roles mapper populates
#   # the ACCESS token, not the ID token this server verifies - turn on "Add to ID token".
#   # roles_claim: realm_access.roles
#   #
#   # account_source: group only -----------------------------------------------
#   # Dotted path to the groups claim. Keycloak does NOT include groups by default - add a
#   # "Group Membership" mapper to the client; 'groups' is its default claim name. Values may be
#   # plain names or full paths (/pharmacy/dispensary); the last segment is what is matched.
#   # group_claim: groups
#   #
#   # Prefix applied to the role (username_claim mode) or group (group mode) before looking it up
#   # as an mSupply user account, e.g. 'dispensary' -> account 'role_dispensary'. Strongly
#   # recommended: without it any realm role or group sharing a name with a real mSupply user
#   # reaches that user's permissions - or, in group mode, the account itself.
#   role_template_prefix: "role_"
#   #
#   # End the identity provider's session when the user logs out of mSupply
#   # (OIDC RP-Initiated Logout). Off by default: for most deployments, leaving mSupply should not
#   # sign the user out of every other application on the realm. The provider shows its own logout
#   # confirmation (no id_token_hint is sent - see the docs), and only sessions the provider
#   # authenticated are affected. The return URL must be registered on the Keycloak client under
#   # "Valid post logout redirect URIs".
#   # logout_from_provider: false
#   # button_label: "Sign in with Keycloak"
# features:
#   stock_movement: true
#   enable_multi_device_site: true # central server only; enables the multi-device toggle on the Sites screen
# changelog_partition: # postgres-only; controls partitioning of the changelog table
#   partition_size: 5000000      # cursor values per partition
#   lookahead: 30000000          # number of insertable records headroom for changelog; also the lower bound — yaml values below this are clamped up
#   interval:                    # poll period for the runtime top-up task
#     hours: 0
#     mins: 1
#     secs: 0
# changelog_dedup: # central + postgres only; periodically deletes superseded (duplicate) changelog rows
#   interval:                    # how often the task wakes to consider a dedup run
#     hours: 24
#     mins: 0
#     secs: 0
#   time_window:                 # optional; if set, dedup only runs between these local times and stops at 'to'
#     from: "02:00"
#     to: "05:00"
#   batch_size: 50000            # changelog rows deleted per committed batch
