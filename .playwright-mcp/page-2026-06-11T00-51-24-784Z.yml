    - heading "How the exact ↔ estimate switch works (Option A)" [level=2] [ref=e101]
    - paragraph [ref=e102]:
      - text: It is not "always an estimate". Every count request first runs
      - code [ref=e103]: EXPLAIN (FORMAT JSON)
      - text: on the already-built, filtered query — same SQL, same bind parameters, just prefixed.
      - code [ref=e104]: EXPLAIN
      - text: only
      - emphasis [ref=e105]: plans
      - text: ": it reads table statistics and computes selectivity, never touching the rows, which is why it costs ~8 ms at any scale. The planner's row estimate then decides:"
    - list [ref=e106]:
      - listitem [ref=e107]: Estimate ≥ 10,000 → return the estimate. Counting precisely past tens of thousands of rows is expensive, and no user distinguishes 1,004,007 from 1,004,135 in a pager.
      - listitem [ref=e108]:
        - text: Estimate < 10,000 → run the real
        - code [ref=e109]: COUNT(*)
        - text: . Small counts are milliseconds-cheap, so most stores keep today's exact behaviour — and this branch self-corrects a wrong-low estimate (stale stats saying "800" when there are 2M rows results in one slow-but-correct count, never a wildly wrong number).
      - listitem [ref=e110]:
        - generic [ref=e111]:
          - code [ref=e112]: EXPLAIN
          - text: fails for any reason
        - text: → silently fall back to the exact count.
    - heading "The failure mode that matters — and the clamp that closes it" [level=2] [ref=e113]
    - generic [ref=e114]:
      - heading "Wrong-low estimates would hide data" [level=3] [ref=e115]
      - paragraph [ref=e116]:
        - text: The frontend derives its page count from
        - code [ref=e117]: totalCount
        - text: and disables paging past it. If the estimate ran low (worst case ~10% after a bulk import, before auto-ANALYZE), the last pages of the list — the
        - emphasis [ref=e118]: newest
        - text: invoices under the default sort — would be unreachable. Estimating too high is benign by comparison (one short/empty page at the end).
    - paragraph [ref=e119]: "The fix costs nothing: the resolver already fetched the page, and the page is ground truth. Before returning, the count is clamped against what the page proved:"
    - list [ref=e120]:
      - listitem [ref=e121]:
        - text: A full page at an offset the count doesn't cover proves at least one more row exists → report
        - code [ref=e122]: offset + rows + 1
        - text: ", so the \"next page\" button stays alive and the count refines as the user browses. The true end of the list is always reachable."
      - listitem [ref=e123]:
        - text: A non-empty short page means the query ran past the end of the data →
        - code [ref=e124]: offset + rows
        - emphasis [ref=e125]: is
        - text: the exact total; the count snaps to it (this also corrects wrong-
        - emphasis [ref=e126]: high
        - text: estimates the moment the real last page is reached).
      - listitem [ref=e127]: Exact counts are never altered by the clamp — every branch is a no-op for them.
    - paragraph [ref=e128]:
      - text: "Verified live against the 1M store: at offset 1,004,000 (a full page past the 1,004,007 estimate) the API reports 1,004,051 and keeps paging; at offset 1,004,100 (a 35-row short page) it snaps to the exact 1,004,135. Belt-and-braces operational extra: schedule an"
      - code [ref=e129]: ANALYZE invoice
      - text: after bulk loads/sync catch-ups to bound the cosmetic error window.
