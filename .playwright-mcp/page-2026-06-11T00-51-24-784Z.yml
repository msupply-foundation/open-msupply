    - heading "What indexing can fix — and what it can't" [level=2] [ref=e39]
    - paragraph [ref=e40]: "First suspicion was a missing index, and indexing did matter — just not for the count:"
    - list [ref=e41]:
      - listitem [ref=e42]:
        - text: Added a composite index
        - code [ref=e43]: (store_id, invoice_number)
        - text: ": the sorted 50-row page query now reads exactly 50 rows. Execution time 2.1 ms → 0.9 ms."
      - listitem [ref=e44]:
        - text: Dropped the existing single-column
        - code [ref=e45]: invoice_number
        - text: index — it was actively
        - emphasis [ref=e46]: harmful
        - text: "here: the planner walked the whole-table index in sort order and post-filtered, discarding 707 rows for every 50 returned."
      - listitem [ref=e47]: But the k6 numbers didn't move (~20 req/s before and after). The count dominates so completely that fixing the page query is invisible until the count is dealt with.
      - listitem [ref=e48]: We also tried partial and covering indexes for the count itself. Postgres declined them all — correctly. An exact count must visit every matching row; with 1M matches the planner's parallel seq scan (~75–110 ms) is already the cheapest plan there is.
    - figure "The index work is real and worth shipping (it keeps the page query <1 ms at any table size) — it just can't touch the count. Production would take these as a migration." [ref=e49]:
      - 'img "Page query: 2.1ms with old index vs 0.9ms with composite index" [ref=e50]'
      - generic [ref=e51]: The index work is real and worth shipping (it keeps the page query <1 ms at any table size) — it just can't touch the count. Production would take these as a migration.
