    - heading "How we got here" [level=2] [ref=e31]
    - paragraph [ref=e32]: "This came out of the Rust → Go backend-port spike. To compare the servers fairly we ran identical GraphQL invoice-list queries against the same Postgres database at three scales. On small stores both servers comfortably exceed 1,000 req/s. On the 1M-invoice store, both collapsed to ~20–30 req/s — and the ordering even flipped (Go slightly ahead, partly a connection-pool artefact: Rust caps its pool at 10 connections, the Go spike's was unbounded)."
    - paragraph [ref=e33]: "That convergence was the tell. When two completely different implementations hit the same wall, the wall is the database. And the more important realisation: this isn't a Rust-vs-Go question at all — it's a scaling question we already own in production today. Any site whose invoice table grows large will see its list screens degrade exactly this way, on either backend."
