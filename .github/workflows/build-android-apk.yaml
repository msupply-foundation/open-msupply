on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

name: Android Build

jobs:
  create-android-build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read .nvmrc
        run: echo "NVMRC=$(cat ./client/.nvmrc)" >> "$GITHUB_OUTPUT"
        id: nvm

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"
          # Don't auto-cache via packageManager: it runs the global yarn 1
          # before corepack is enabled (#12508)
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Get Properties
        id: properties
        run: |
          cp "$HOME/android/local.properties" ./client/packages/android
          cp "$HOME/android/release.keystore" ./client/packages/android/app

      - name: Read Rust toolchain channel
        id: rust_toolchain
        # Scope the toolchain to this job only via RUSTUP_TOOLCHAIN; do NOT set a
        # global rustup default/override on the shared self-hosted runner, or it
        # would leak into develop builds (which pin a different channel).
        run: |
          CHANNEL=$(grep '^channel' server/rust-toolchain.toml | cut -d '"' -f2)
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$CHANNEL" >> "$GITHUB_ENV"
      - name: Set Up Rust
        run: rustup toolchain install "${{ steps.rust_toolchain.outputs.channel }}" --profile minimal --no-self-update

      - name: Add Android targets for pinned toolchain
        # The self-hosted runner pre-installs the Android targets for its default
        # (stable) toolchain only. Now that cargo runs under the pinned channel
        # (RUSTUP_TOOLCHAIN), those targets must be installed for it explicitly or
        # the std crate can't be found (E0463). Targets need to match those in the
        # config.toml of the self-hosted machine.
        run: rustup target add aarch64-linux-android armv7-linux-androideabi --toolchain "${{ steps.rust_toolchain.outputs.channel }}"

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version-file: client/.java-version

      - name: Regenerate Capacitor plugin config
        # capacitor.settings.gradle is a generated file that points each plugin
        # at a node_modules path baked in for one specific Yarn hoist layout.
        # The workspace root moved to the repo root, so packages now hoist to the
        # repo-root node_modules and the committed paths no longer resolve
        # (Gradle: "No variants exist"). `cap update` rewrites those paths to
        # match wherever Yarn actually installed the plugins on this runner. It
        # does not copy web assets, so it can run before the web bundle exists.
        working-directory: ./client/packages/android
        run: npx cap update android

      - name: Mint token for the frontend repo
        uses: actions/create-github-app-token@v3
        id: fe-token
        with:
          app-id: ${{ vars.FE_APP_ID }}
          private-key: ${{ secrets.FE_APP_PRIVATE_KEY }}
          owner: msupply-foundation
          repositories: open-msupply-frontend

      - name: Build Android App
        working-directory: client
        run: yarn android:build:release
        env:
          NDK_BIN: /Users/tmfmacmini/android/ndk/27.2.12479018/toolchains/llvm/prebuilt/darwin-x86_64/bin/
          # Update this version when upgrading the NDK version on the self-hosted machine
          # Transition APK ships the new FE at / and this repo's build as the old UI
          # at /old-ui/. stage-transition-frontend.sh fetches the pinned new FE, which
          # with a short-lived token minted above from the same GitHub App the e2e
          # workflow uses to read the private open-msupply-frontend repo (GITHUB_TOKEN
          # can't reach it; no PAT to expire or rotate). It fails loudly on the
          # placeholder pin, so this build fails until the pin is real; set the
          # FRONTEND_DIST_URL repo variable to a dist zip to unblock before then (empty
          # vars are ignored).
          FRONTEND_FETCH_TOKEN: ${{ steps.fe-token.outputs.token }}
          FRONTEND_DIST_URL: ${{ vars.FRONTEND_DIST_URL }}
          FRONTEND_DIST_SHA256: ${{ vars.FRONTEND_DIST_SHA256 }}

      - name: Upload Universal APK
        uses: actions/upload-artifact@v6
        with:
          name: Open_mSupply_Universal_Build
          path: ./client/packages/android/app/build/outputs/apk/universal/release/*.apk
          retention-days: 3

      - name: Upload Arm64 APK
        uses: actions/upload-artifact@v6
        with:
          name: Open_mSupply_Arm64_Build
          path: ./client/packages/android/app/build/outputs/apk/arm64/release/*.apk
          retention-days: 3

      - name: Upload Universal APK to Backblaze B2
        env:
          SLACK_DEV_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_DEV_RELEASE_WEBHOOK_URL }}
          SLACK_RC_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RC_RELEASE_WEBHOOK_URL }}
          NOTIFICATION_TYPE: "android_build"
          BUILD_STATUS: ${{ job.status }}
          TAG_NAME: ${{ github.ref_name }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: bash .github/scripts/mac_backblaze_upload.sh

  # Reports non-success outcomes (failure, cancellation, and the queue-timeout
  # that happens when no self-hosted runner is available) to Slack. Runs on a
  # GitHub-hosted runner so it still fires when the self-hosted runner is down -
  # the build job's own steps never execute in that case, so they cannot notify.
  notify-build-result:
    needs: create-android-build
    if: ${{ always() && needs.create-android-build.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Send build completion notification
        env:
          SLACK_DEV_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_DEV_RELEASE_WEBHOOK_URL }}
          SLACK_RC_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RC_RELEASE_WEBHOOK_URL }}
          NOTIFICATION_TYPE: "android_build"
          BUILD_STATUS: ${{ needs.create-android-build.result }}
          TAG_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/send-slack-notification.sh
