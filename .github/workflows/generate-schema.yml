name: Generate GraphQL Schema

on:
  pull_request:
    paths:
      - 'client/packages/**/src/**/*.graphql'
      - 'server/graphql/**'
  merge_group:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Read .nvmrc
        run: echo "NVMRC=$(cat ./client/.nvmrc)" >> "$GITHUB_OUTPUT"
        id: nvm

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
          # Don't auto-cache via packageManager: it runs the global yarn 1
          # before corepack is enabled (#12508)
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Update PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run tests
        run: cd ./client && yarn test:codegen

      # test:codegen runs `yarn generate`, which rewrites the generated types in
      # place. Anything it changes is drift between the server schema and the
      # checked-in output, so fail here rather than leaving it for whoever next
      # regenerates for an unrelated reason (#12643).
      - name: Check generated types are up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated GraphQL types are out of date. Run 'yarn generate' in ./client and commit the result."
            exit 1
          fi
