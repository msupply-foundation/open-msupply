# Build and push Docker images to Docker Hub when a version tag is pushed.
#
# Release tags (e.g. v2.19.1) build all variants:
#   - 4 images: (sqlite|postgres) x (amd64|arm64)
#   - 2 dev images: (sqlite|postgres) x amd64 only
#   - triggers downstream plugin tests
#
# Non-release tags (e.g. v2.18.00-develop-04160443, v2.17.03-RC-04161543)
# build a reduced set:
#   - 2 images: (sqlite|postgres) x amd64 only
#   - no dev images, no plugin tests
#
# Images are pushed to: msupplyfoundation/omsupply:<tag>-<db>-<arch>[-dev]
#
# Floating tags are also repointed (amd64 images only; bare tag = sqlite flavour):
#   release tag      -> latest, latest-sqlite, latest-postgres
#   develop nightly  -> latest-develop, latest-develop-sqlite, latest-develop-postgres
#   RC nightly       -> latest-rc, latest-rc-sqlite, latest-rc-postgres

name: Dockerise

on:
  push:
    tags:
      - "v*"

jobs:
  check-tag:
    name: Check Tag Type
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      floating_prefix: ${{ steps.check.outputs.floating_prefix }}
    steps:
      - name: Determine if release tag
        id: check
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "floating_prefix=latest" >> $GITHUB_OUTPUT
            echo "Tag '$TAG' is a release tag (floating: latest)"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            # Nightly tags from create-nightly-tags.sh: v<version>-<develop|RC>-MMDDHHMM.
            # Anything else (e.g. manual test tags) gets no floating tag.
            if [[ "$TAG" =~ ^v[0-9][0-9.]*-develop-[0-9]{8}$ ]]; then
              echo "floating_prefix=latest-develop" >> $GITHUB_OUTPUT
            elif [[ "$TAG" =~ ^v[0-9][0-9.]*-RC-[0-9]{8}$ ]]; then
              echo "floating_prefix=latest-rc" >> $GITHUB_OUTPUT
            else
              echo "floating_prefix=" >> $GITHUB_OUTPUT
            fi
            echo "Tag '$TAG' is NOT a release tag (skipping arm64 and dev builds)"
          fi

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read .nvmrc
        run: echo "NVMRC=$(cat ./client/.nvmrc)" >> "$GITHUB_OUTPUT"
        id: nvm

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"
          # Don't auto-cache via packageManager: it runs the global yarn 1
          # before corepack is enabled (#12508)
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # This repo's client build is the OLD UI, served under /old-ui/ (asset URLs +
      # router base). The new FE served at / is fetched below as the pinned dist.
      - name: Build client (old UI at /old-ui/)
        run: |
          cd ./client
          NODE_OPTIONS="--max_old_space_size=4096" PUBLIC_PATH=/old-ui/ yarn build

      - name: Save old-UI artifacts
        uses: actions/upload-artifact@v6
        with:
          name: client-dist
          path: client/packages/host/dist
          retention-days: 1

      # New FE served at / : fetch the pinned, checksum-verified dist host-side (no
      # network fetch inside docker build) and ship it into the image as files.
      # The FE repo is private and GITHUB_TOKEN only grants this repo, so a
      # short-lived token is minted from the same GitHub App the e2e workflow uses
      # to read open-msupply-frontend (vars.FE_APP_ID / secrets.FE_APP_PRIVATE_KEY —
      # no PAT to expire or rotate). Until the FE repo cuts a release the pin is a placeholder
      # and this step fails loudly (matching the mac build's "wrong FE at / is worse
      # than a loud failure" stance); nightly tags will fail here until the pin is
      # real. To unblock before then, set the FRONTEND_DIST_URL repo variable to a
      # dist zip (the same override the mac build documents) — empty vars are ignored.
      - name: Mint token for the frontend repo
        uses: actions/create-github-app-token@v3
        id: fe-token
        with:
          client-id: ${{ vars.FE_APP_ID }}
          private-key: ${{ secrets.FE_APP_PRIVATE_KEY }}
          owner: msupply-foundation
          repositories: open-msupply-frontend

      - name: Fetch new frontend (pinned dist)
        env:
          FRONTEND_FETCH_TOKEN: ${{ steps.fe-token.outputs.token }}
          FRONTEND_DIST_URL: ${{ vars.FRONTEND_DIST_URL }}
          FRONTEND_DIST_SHA256: ${{ vars.FRONTEND_DIST_SHA256 }}
        run: node build/fetch-frontend.js frontend-dist

      - name: Save new-frontend artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend-dist
          retention-days: 1

  generate-matrix:
    name: Generate Build Matrix
    runs-on: ubuntu-latest
    needs: check-tag
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ needs.check-tag.outputs.is_release }}" = "true" ]; then
            echo 'matrix={"db":["sqlite","postgres"],"arch":["amd64","arm64"]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"db":["sqlite","postgres"],"arch":["amd64"]}' >> $GITHUB_OUTPUT
          fi

  build-server:
    name: Build server (${{ matrix.db }}, ${{ matrix.arch }})
    needs: [build-client, check-tag, generate-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build server
        run: |
          RUST_IMAGE="rust:1.94-slim"
          CARGO_FLAGS=""
          TARGET_DIR="target"
          if [ "${{ matrix.db }}" = "postgres" ]; then
            RUST_IMAGE="rust:1.94"
            CARGO_FLAGS="--no-default-features --features postgres"
            TARGET_DIR="target-postgres"
          fi

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            # Native build on amd64 runner
            docker run --rm --user "$(id -u)":"$(id -g)" \
              -v "$PWD":/usr/src/omsupply \
              -w /usr/src/omsupply/server \
              $RUST_IMAGE \
              cargo build --release --target-dir $TARGET_DIR \
                --bin remote_server --bin remote_server_cli $CARGO_FLAGS
          else
            # Cross-compile for arm64 (much faster than QEMU emulation)
            CROSS_EXTRA=""
            if [ "${{ matrix.db }}" = "postgres" ]; then
              CROSS_EXTRA="&& dpkg --add-architecture arm64 && apt-get update && apt-get install -y libpq-dev:arm64"
            fi

            docker run --rm \
              -v "$PWD":/usr/src/omsupply \
              -w /usr/src/omsupply/server \
              $RUST_IMAGE bash -c "\
                apt-get update && apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
                $CROSS_EXTRA && \
                rustup target add aarch64-unknown-linux-gnu && \
                CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
                PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
                PQ_LIB_DIR=/usr/lib/aarch64-linux-gnu \
                  cargo build --release --target aarch64-unknown-linux-gnu \
                    --target-dir $TARGET_DIR --bin remote_server --bin remote_server_cli $CARGO_FLAGS && \
                mkdir -p $TARGET_DIR/release && \
                cp $TARGET_DIR/aarch64-unknown-linux-gnu/release/remote_server $TARGET_DIR/release/remote_server && \
                cp $TARGET_DIR/aarch64-unknown-linux-gnu/release/remote_server_cli $TARGET_DIR/release/remote_server_cli && \
                chown -R $(id -u):$(id -g) $TARGET_DIR"
          fi

      - name: Save server executable artifacts
        uses: actions/upload-artifact@v6
        with:
          name: server-executables-${{ matrix.db }}-${{ matrix.arch }}
          path: |
            server/target/release/remote_server
            server/target/release/remote_server_cli
            server/target-postgres/release/remote_server
            server/target-postgres/release/remote_server_cli
          retention-days: 1

  dockerise:
    name: Dockerise (${{ matrix.db }}, ${{ matrix.arch }})
    needs: [build-server, check-tag, generate-matrix]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    outputs:
      image_tag: ${{ env.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load server artifacts
        uses: actions/download-artifact@v7
        with:
          name: server-executables-${{ matrix.db }}-${{ matrix.arch }}
          path: server/

      # The frontend is no longer embedded in the server binary; the image ships it
      # as files (see Dockerfile) so both frontends must be in the build context.
      # New FE at / -> ./frontend-dist ; old UI at /old-ui/ -> client/packages/host/dist
      - name: Load new-frontend artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Load old-UI (client) artifacts
        uses: actions/download-artifact@v7
        with:
          name: client-dist
          path: client/packages/host/dist

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Version from Tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set build variables
        id: vars
        run: |
          if [ "${{ matrix.db }}" = "sqlite" ]; then
            echo "target=sqlite" >> $GITHUB_OUTPUT
            echo "target_dev=dev" >> $GITHUB_OUTPUT
          else
            echo "target=postgres" >> $GITHUB_OUTPUT
            echo "target_dev=postgres-dev" >> $GITHUB_OUTPUT
          fi

          # Floating tags are repointed from amd64 images only (the release
          # matrix includes arm64); the bare tag is the sqlite flavour.
          TAGS="msupplyfoundation/omsupply:${VERSION}-${{ matrix.db }}-${{ matrix.arch }}"
          FLOATING="${{ needs.check-tag.outputs.floating_prefix }}"
          if [ -n "$FLOATING" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            TAGS="$TAGS,msupplyfoundation/omsupply:${FLOATING}-${{ matrix.db }}"
            if [ "${{ matrix.db }}" = "sqlite" ]; then
              TAGS="$TAGS,msupplyfoundation/omsupply:${FLOATING}"
            fi
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ steps.vars.outputs.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: Build and Push Docker Image Dev
        if: matrix.arch == 'amd64' && needs.check-tag.outputs.is_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ steps.vars.outputs.target_dev }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            msupplyfoundation/omsupply:${{ env.VERSION }}-${{ matrix.db }}-${{ matrix.arch }}-dev

  trigger-plugin-tests:
    name: Trigger Plugin Tests
    needs: [dockerise, check-tag]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.check-tag.outputs.is_release == 'true'
    uses: ./.github/workflows/trigger-plugin-tests.yaml
    with:
      image_tag: ${{ needs.dockerise.outputs.image_tag }}-dev
    secrets:
      ORG_WORKFLOW_TOKEN: ${{ secrets.ORG_WORKFLOW_TOKEN }}
