name: E2E regression (hermetic)

# Deterministic Playwright suites against the committed reference datafile
# (server/data/e2e) — the whole stack is booted by the same script devs use
# locally (`yarn e2e:local`), so results here should match local runs exactly.
#
# The suites are DEFINED IN open-msupply-frontend (e2e/ there): the cross-FE
# test-id contract (e2e/TESTIDS.md) lets one suite definition verify both the
# current app and the rewrite, so this workflow checks that repo out and runs
# its suites against the front end built here.
#
# NON-BLOCKING while the suite builds trust: not in branch protection yet.
# Flake policy before gating: one retry max, quarantine-or-fix same day.

on:
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - ".github/workflows/e2e-regression.yaml"
  workflow_dispatch:

env:
  # Where the suite definitions live.
  FE_SUITES_REPO: msupply-foundation/open-msupply-frontend
  FE_SUITES_REF: main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Deterministic e2e (reference datafile)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    env:
      # Share the backend-tests sqlite target dir — the default (sqlite)
      # feature build here reuses that cache.
      CARGO_TARGET_DIR: /tmp/target/sqlite
      TZ: UTC
    steps:
      - name: Update PATH
        run: echo "$HOME/.cargo/bin:/opt/homebrew/bin" >> $GITHUB_PATH

      - uses: actions/checkout@v4

      # open-msupply-frontend is private and the default GITHUB_TOKEN only
      # reads THIS repo — a GitHub App scoped to reading that repo mints a
      # short-lived token per run (no PAT to expire or rotate).
      - name: Mint token for the suites repo
        uses: actions/create-github-app-token@v3
        id: fe-token
        with:
          client-id: ${{ vars.FE_APP_ID }}
          private-key: ${{ secrets.FE_APP_PRIVATE_KEY }}
          owner: msupply-foundation
          repositories: open-msupply-frontend

      - name: Check out open-msupply-frontend (suite definitions)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FE_SUITES_REPO }}
          ref: ${{ env.FE_SUITES_REF }}
          path: .fe-suites
          token: ${{ steps.fe-token.outputs.token }}

      - name: Read Rust toolchain channel
        # Scope the toolchain to this job only via RUSTUP_TOOLCHAIN; do NOT set
        # a global rustup default/override on the shared self-hosted runner.
        run: |
          CHANNEL=$(grep '^channel' server/rust-toolchain.toml | cut -d '"' -f2)
          echo "RUSTUP_TOOLCHAIN=$CHANNEL" >> "$GITHUB_ENV"

      - name: Read .nvmrc
        run: echo "NVMRC=$(cat ./client/.nvmrc)" >> "$GITHUB_OUTPUT"
        id: nvm

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"

      - name: Enable Corepack (yarn here, pnpm in the suites repo)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install suite dependencies
        run: cd .fe-suites && pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: cd .fe-suites && pnpm exec playwright install chromium

      - name: Pick ports
        # The runner box can host concurrent jobs — derive a port pair per run
        # so two e2e jobs never collide (server also binds port+1 for discovery).
        run: |
          OFFSET=$(( ${{ github.run_id }} % 100 ))
          echo "E2E_SERVER_PORT=$(( 9400 + OFFSET * 2 ))" >> "$GITHUB_ENV"
          echo "E2E_FE_PORT=$(( 3200 + OFFSET ))" >> "$GITHUB_ENV"

      - name: Run deterministic suites
        env:
          FE_SUITES_DIR: ${{ github.workspace }}/.fe-suites
          # Provenance stamped into the Playwright report (the suites'
          # e2e/playwright.config.ts `metadata`). The PR head SHA — not
          # github.sha, which is the ephemeral merge commit — so the report
          # names a commit that stays resolvable. Falls back to plain ref/sha
          # for workflow_dispatch runs.
          E2E_META_PR: ${{ github.event.pull_request.number }}
          E2E_META_BRANCH: ${{ github.head_ref || github.ref_name }}
          E2E_META_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cd client && yarn e2e:local stocktake-regression distribution-regression names-regression dashboard-regression chrome-regression

      - name: Upload Playwright report (html + results.json)
        uses: actions/upload-artifact@v4
        if: (!cancelled())
        with:
          name: e2e-playwright-report
          path: .fe-suites/e2e/playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload traces and stack logs
        uses: actions/upload-artifact@v4
        if: (!cancelled())
        with:
          name: e2e-test-results
          path: |
            .fe-suites/e2e/test-results
            .fe-suites/e2e/stack-logs
          if-no-files-found: ignore
          retention-days: 7
