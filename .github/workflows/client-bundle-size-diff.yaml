name: Bundle size diff - Build

on:
  pull_request:
    paths:
      - 'client/**'
  merge_group:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-base:
    name: Build base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.base_ref }}

      - name: Read .nvmrc
        run: echo "NVMRC=$(cat ./client/.nvmrc)" >> "$GITHUB_OUTPUT"
        id: nvm

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
          # Don't auto-cache via packageManager: it runs the global yarn 1
          # before corepack is enabled (#12508)
          package-manager-cache: false

      # Install/Build tolerate failure so a broken base branch doesn't fail
      # the PR check. The compare job detects the missing artifact and posts
      # a warning comment instead of a diff.
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: corepack enable && yarn install --immutable

      - name: Build
        id: build
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        run: cd ./client && yarn build-stats

      - name: Upload base stats.json
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: base
          path: ./client/packages/host/dist/stats.json
          retention-days: 3

  build-pr:
    name: Build PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read .nvmrc
        run: echo "NVMRC=$(cat ./client/.nvmrc)" >> "$GITHUB_OUTPUT"
        id: nvm

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
          # Don't auto-cache via packageManager: it runs the global yarn 1
          # before corepack is enabled (#12508)
          package-manager-cache: false

      - name: Install dependencies
        run: corepack enable && yarn install --immutable

      - name: Build
        run: cd ./client && yarn build-stats

      - name: Upload PR stats.json
        uses: actions/upload-artifact@v6
        with:
          name: pr-stats
          path: ./client/packages/host/dist/stats.json
          retention-days: 3

  compare:
    name: Compare bundle sizes
    needs: [build-base, build-pr]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Download base stats
        id: download-base
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: base
          path: base

      - name: Download PR stats
        uses: actions/download-artifact@v7
        with:
          name: pr-stats
          path: pr

      - name: Calculate diff
        if: ${{ steps.download-base.outcome == 'success' }}
        id: get-diff
        # Sums .assets[].size from the webpack stats files, replicating the
        # retired NejcZdovc/bundle-size-diff action (unmaintained, node12).
        run: |
          base=$(jq '[.assets[].size] | add // 0' base/stats.json)
          pr=$(jq '[.assets[].size] | add // 0' pr/stats.json)
          diff=$((pr - base))
          human() {
            awk -v b="$1" 'BEGIN {
              sign = b < 0 ? "-" : ""; b = b < 0 ? -b : b
              split("B KB MB GB TB", u, " "); i = 1
              while (b >= 1024 && i < 5) { b /= 1024; i++ }
              printf "%s%.2f %s", sign, b, u[i]
            }'
          }
          percent=$(awk -v o="$base" -v n="$pr" 'BEGIN { printf "%.2f", o ? (n - o) / o * 100 : 0 }')
          {
            echo "base_file_string=$(human "$base")"
            echo "pr_file_string=$(human "$pr")"
            echo "diff_file_string=$(human "$diff")"
            echo "percent=$percent"
          } >> "$GITHUB_OUTPUT"

      - name: Save comparison data
        run: |
          echo "${{ github.event.pull_request.number }}" > pr_number
          if [ "${{ steps.download-base.outcome }}" = "success" ]; then
            cat > result.txt << 'EOF'
          ## Bundle size difference
          Comparing this PR to `main`

          |Old size      | New size     | Diff                     |
          |:------------ |:-------------|:-------------------------|
          |${{ steps.get-diff.outputs.base_file_string }}         |${{ steps.get-diff.outputs.pr_file_string }}         | ${{ steps.get-diff.outputs.diff_file_string }} (${{ steps.get-diff.outputs.percent }}%) |
          EOF
          else
            cat > result.txt << 'EOF'
          ## Bundle size difference

          ⚠️ Unable to run bundle size diff check due to failing base branch build.
          EOF
          fi

      - name: Upload comparison artifact
        uses: actions/upload-artifact@v6
        with:
          name: pr-artifact
          path: |
            pr_number
            result.txt
          retention-days: 3
