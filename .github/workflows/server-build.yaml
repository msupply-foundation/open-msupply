on: workflow_dispatch

name: Remote Server Mac Build

jobs:
  build_and_test:
    name: Remote Server Mac Build
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      RUSTFLAGS: '--cfg recursion_limit_256'
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Initialise
        working-directory: ./server
        run: cargo run --bin remote_server_cli -- initialise-from-export -n 'reference1' -r
      - name: Mint token for the frontend repo
        uses: actions/create-github-app-token@v2
        id: fe-token
        with:
          app-id: ${{ vars.FE_APP_ID }}
          private-key: ${{ secrets.FE_APP_PRIVATE_KEY }}
          owner: msupply-foundation
          repositories: open-msupply-frontend
      - name: Build
        run: ./build/mac/build.sh
        env:
          # build/mac/build.sh fetches the pinned new FE via build/fetch-frontend.js —
          # see server/README.md 'Serving front-end'. Empty vars are ignored.
          FRONTEND_FETCH_TOKEN: ${{ steps.fe-token.outputs.token }}
          FRONTEND_DIST_URL: ${{ vars.FRONTEND_DIST_URL }}
          FRONTEND_DIST_SHA256: ${{ vars.FRONTEND_DIST_SHA256 }}
      - uses: actions/upload-artifact@v6
        with:
          name: mac_sqlite
          path: |
            **_mac_sqlite
            server/omsupply-database