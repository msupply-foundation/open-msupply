name: Nightly Automated Builds
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *" # Every day at 06:30 AM UTC - equivalent to 06:30 PM NZST (or 07:30 PM NZDT)

jobs:
  create-tags:
    runs-on: ubuntu-latest
    outputs:
      CREATED_TAGS: ${{ steps.create_tags.outputs.CREATED_TAGS }}
      AFFECTED_BRANCHES: ${{ steps.create_tags.outputs.AFFECTED_BRANCHES }}
      HAS_TAGS: ${{ steps.create_tags.outputs.HAS_TAGS }}
    steps:
      # Tags pushed with the workflow's own GITHUB_TOKEN would not trigger
      # the tag-driven build workflows, so push with an app-minted token.
      - name: Mint tmf-ci-bot token
        uses: actions/create-github-app-token@v3
        id: bot-token
        with:
          client-id: ${{ vars.TMF_CI_BOT_APP_ID }}
          private-key: ${{ secrets.TMF_CI_BOT_PRIVATE_KEY }}
          owner: msupply-foundation
          repositories: open-msupply

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create tags for target branches
        id: create_tags
        run: bash .github/scripts/create-nightly-tags.sh

  send-notifications:
    needs: create-tags
    if: needs.create-tags.outputs.HAS_TAGS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Send Slack notifications
        env:
          SLACK_DEV_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_DEV_RELEASE_WEBHOOK_URL }}
          SLACK_RC_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RC_RELEASE_WEBHOOK_URL }}
          CREATED_TAGS: ${{ needs.create-tags.outputs.CREATED_TAGS }}
          AFFECTED_BRANCHES: ${{ needs.create-tags.outputs.AFFECTED_BRANCHES }}
        run: bash .github/scripts/send-slack-notification.sh
