server:
  port: 8000
  danger_allow_http: true
database:
  host: 'localhost'
  port: 5432
  username: 'user'
  password: 'pass'
  database_name: omsupply-demo
logging:
  mode: All
  level: Info
  directory: log
  filename: remote_server.log
  #   max number of rotated (gzip compressed) logfiles to keep, in addition to the active logfile
  # max_file_count: 50
  #   max size in MB of the active logfile before it is rotated.
  #   Left unset, defaults to 100 for postgres builds and 20 for sqlite builds
  # max_file_size: 20

