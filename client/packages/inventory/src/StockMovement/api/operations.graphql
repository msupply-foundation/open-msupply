fragment StockMovementRow on StockRelocationNode {
  __typename
  id
  createdDatetime
  finalisedDatetime
  status
  numberOfPacks
  fromPackSize
  availableNumberOfPacks
  toPackSize
  onHold
  restrictedLocationTypeId
  itemCode
  itemName
  batch
  expiryDate
  fromStockLineId
  toStockLineId
  fromLocation {
    __typename
    id
    code
    name
    onHold
  }
  toLocation {
    __typename
    id
    code
    name
  }
}

fragment StockMovementDraftLine on DraftStockRelocationLineNode {
  __typename
  id
  fromStockLineId
  itemId
  itemCode
  itemName
  restrictedLocationTypeId
  batch
  expiryDate
  fromPackSize
  availableNumberOfPacks
  onHold
  fromNumberOfPacks
  toPackSize
  toNumberOfPacks
  fromLocation {
    __typename
    id
    code
    name
  }
  toLocation {
    __typename
    id
    code
    name
  }
}

query stockRelocationDraftLines(
  $storeId: String!
  $input: StockRelocationDraftLinesInput!
) {
  stockRelocationDraftLines(storeId: $storeId, input: $input) {
    ...StockMovementDraftLine
  }
}

query stockRelocations(
  $storeId: String!
  $filter: StockRelocationFilterInput
  $page: PaginationInput
  $sort: [StockRelocationSortInput!]
) {
  stockRelocations(
    storeId: $storeId
    filter: $filter
    page: $page
    sort: $sort
  ) {
    __typename
    ... on StockRelocationConnector {
      __typename
      totalCount
      nodes {
        ...StockMovementRow
      }
    }
  }
}

mutation insertStockRelocation(
  $input: InsertStockRelocationInput!
  $storeId: String!
) {
  insertStockRelocation(input: $input, storeId: $storeId) {
    __typename
    ... on InsertStockRelocationNode {
      __typename
      ids
    }
    ... on InsertStockRelocationError {
      __typename
      error {
        __typename
        description
      }
    }
  }
}

mutation updateStockRelocation(
  $input: UpdateStockRelocationInput!
  $storeId: String!
) {
  updateStockRelocation(input: $input, storeId: $storeId) {
    __typename
    ... on UpdateStockRelocationNode {
      __typename
      id
    }
    ... on UpdateStockRelocationError {
      __typename
      error {
        __typename
        description
      }
    }
  }
}

mutation updateStockRelocations(
  $input: [UpdateStockRelocationInput!]!
  $storeId: String!
) {
  updateStockRelocations(input: $input, storeId: $storeId) {
    __typename
    ... on UpdateStockRelocationsNode {
      __typename
      ids
    }
    ... on UpdateStockRelocationError {
      __typename
      error {
        __typename
        description
      }
    }
  }
}

mutation deleteStockRelocations($ids: [String!]!, $storeId: String!) {
  deleteStockRelocations(ids: $ids, storeId: $storeId) {
    __typename
    ... on DeleteStockRelocationsNode {
      __typename
      ids
    }
  }
}

mutation deleteStockRelocation(
  $input: DeleteStockRelocationInput!
  $storeId: String!
) {
  deleteStockRelocation(input: $input, storeId: $storeId) {
    __typename
    ... on DeleteResponse {
      __typename
      id
    }
  }
}
