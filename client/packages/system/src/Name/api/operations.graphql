fragment NameRow on NameNode {
  code
  id
  isCustomer
  isSupplier
  isOnHold
  name
  store {
    id
    code
  }
}

# Wider variant used by the customers/suppliers list views, which need the
# V2 property values to render the per-property columns added by the KDD
# prototype. Kept separate from `NameRow` so other consumers (e.g. invoice
# toolbars) don't have to fan their otherParty selections out.
fragment NameRowWithPropertyV2Values on NameNode {
  ...NameRow
  propertyV2Values {
    id
    property {
      id
      name
      type
    }
    option {
      id
      name
    }
    valueText
    valueNumber
    valueReal
    valueDate
  }
}

fragment FacilityNameRow on NameNode {
  code
  id
  isCustomer
  isSupplier
  isDonor
  isOnHold
  name
  store {
    id
    code
  }
  properties
  # Per-store V2 property values — used by the stores list to display the
  # KDD-prototype properties side-by-side with the legacy `properties` JSON
  # for the perf comparison.
  propertyV2Values {
    id
    property {
      id
      name
      type
    }
    option {
      id
      name
    }
    valueText
    valueNumber
    valueReal
    valueDate
  }
}

fragment Name on NameNode {
  address1
  address2
  chargeCode
  code
  comment
  country
  createdDatetime
  email
  id
  isCustomer
  isDonor
  isManufacturer
  isOnHold
  isSupplier
  isSystemName
  name
  phone
  website
  store {
    id
    code
  }
  properties
  hshCode
  hshName
  margin
  freightFactor
  currency {
    id
    code
  }
  # Values from the new property system (KDD option 1). Resolved via the
  # PropertyV2ValuesByNameRecordLoader so list rows are batched.
  propertyV2Values {
    ...PropertyV2Value
  }
}

fragment Property on PropertyNode {
  id
  key
  name
  allowedValues
  valueType
}

# Definition shape used by the property filter on the names list (KDD option 1).
# Includes the `option` rows so the UI can render a dropdown for option-typed
# properties without a second query per property.
fragment NamePropertyV2 on PropertyV2Node {
  id
  name
  type
  options {
    id
    name
    isDeleted
  }
}

query namePropertyV2Definitions {
  propertiesV2ForTable(table: NAME) {
    ...NamePropertyV2
  }
}

query names(
  $storeId: String!
  $key: NameSortFieldInput!
  $desc: Boolean
  $first: Int
  $offset: Int
  $filter: NameFilterInput
) {
  names(
    storeId: $storeId
    page: { first: $first, offset: $offset }
    sort: { key: $key, desc: $desc }
    filter: $filter
  ) {
    ... on NameConnector {
      __typename
      nodes {
        ...NameRowWithPropertyV2Values
      }
      totalCount
    }
  }
}

query facilities(
  $storeId: String!
  $key: NameSortFieldInput!
  $desc: Boolean
  $propertyKey: String
  $first: Int
  $offset: Int
  $filter: NameFilterInput
) {
  names(
    storeId: $storeId
    page: { first: $first, offset: $offset }
    sort: { key: $key, desc: $desc, propertyKey: $propertyKey }
    filter: $filter
  ) {
    ... on NameConnector {
      __typename
      nodes {
        ...FacilityNameRow
      }
      totalCount
    }
  }
}

query nameById($storeId: String!, $nameId: String!) {
  names(storeId: $storeId, filter: { id: { equalTo: $nameId } }) {
    ... on NameConnector {
      __typename
      nodes {
        ...Name
      }
      totalCount
    }
  }
}

query nameProperties {
  nameProperties {
    ... on NamePropertyConnector {
      __typename
      nodes {
        __typename
        id
        remoteEditable
        property {
          ...Property
        }
      }
    }
  }
}

mutation updateNameProperties(
  $storeId: String!
  $input: UpdateNamePropertiesInput!
) {
  updateNameProperties(storeId: $storeId, input: $input) {
    __typename
    ... on NameNode {
      ...Name
    }
    ... on UpdateNamePropertiesError {
      error {
        __typename
        description
      }
    }
  }
}
