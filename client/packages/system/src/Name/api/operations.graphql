fragment NameRow on NameNode {
  code
  id
  isCustomer
  isSupplier
  isOnHold
  name
  store {
    id
    code
  }
  # KDD option 1: relational property values, resolved via
  # PropertyValuesByNameRecordLoader so list rows are batched.
  propertyValues {
    id
    property {
      id
      name
      type
    }
    option {
      id
      name
    }
    valueText
    valueNumber
    valueReal
    valueDate
  }
}

fragment FacilityNameRow on NameNode {
  code
  id
  isCustomer
  isSupplier
  isDonor
  isOnHold
  name
  store {
    id
    code
  }
  properties
}

fragment Name on NameNode {
  address1
  address2
  chargeCode
  code
  comment
  country
  createdDatetime
  email
  id
  isCustomer
  isDonor
  isManufacturer
  isOnHold
  isSupplier
  isSystemName
  name
  phone
  website
  store {
    id
    code
  }
  properties
  hshCode
  hshName
  margin
  freightFactor
  currency {
    id
    code
  }
  # Values from the new property system (KDD option 1). Resolved via the
  # PropertyValuesByNameRecordLoader so list rows are batched.
  propertyValues {
    ...PropertyValue
  }
}

fragment Property on PropertyNode {
  id
  key
  name
  allowedValues
  valueType
}

# Definition shape used by the property filter on the names list (KDD option 1).
# Includes the `option` rows so the UI can render a dropdown for option-typed
# properties without a second query per property.
fragment NameProperty on PropertyNode {
  id
  name
  type
  options {
    id
    name
    isDeleted
  }
}

query namePropertyDefinitions {
  propertiesForTable(table: NAME) {
    ...NameProperty
  }
}

query names(
  $storeId: String!
  $key: NameSortFieldInput!
  $desc: Boolean
  $first: Int
  $offset: Int
  $filter: NameFilterInput
) {
  names(
    storeId: $storeId
    page: { first: $first, offset: $offset }
    sort: { key: $key, desc: $desc }
    filter: $filter
  ) {
    ... on NameConnector {
      __typename
      nodes {
        ...NameRow
      }
      totalCount
    }
  }
}

query facilities(
  $storeId: String!
  $key: NameSortFieldInput!
  $desc: Boolean
  $first: Int
  $offset: Int
  $filter: NameFilterInput
) {
  names(
    storeId: $storeId
    page: { first: $first, offset: $offset }
    sort: { key: $key, desc: $desc }
    filter: $filter
  ) {
    ... on NameConnector {
      __typename
      nodes {
        ...FacilityNameRow
      }
      totalCount
    }
  }
}

query nameById($storeId: String!, $nameId: String!) {
  names(storeId: $storeId, filter: { id: { equalTo: $nameId } }) {
    ... on NameConnector {
      __typename
      nodes {
        ...Name
      }
      totalCount
    }
  }
}

query nameProperties {
  nameProperties {
    ... on NamePropertyConnector {
      __typename
      nodes {
        __typename
        id
        remoteEditable
        property {
          ...Property
        }
      }
    }
  }
}

mutation updateNameProperties(
  $storeId: String!
  $input: UpdateNamePropertiesInput!
) {
  updateNameProperties(storeId: $storeId, input: $input) {
    __typename
    ... on NameNode {
      ...Name
    }
    ... on UpdateNamePropertiesError {
      error {
        __typename
        description
      }
    }
  }
}
