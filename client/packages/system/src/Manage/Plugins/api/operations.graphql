# hostRuntime is null for backend plugins, which have no host. It is selected
# because one plugin ships a bundle per front end and the two can share a code
# and a version — without it the list shows one row twice, and delete acts on an
# id it never displays.
fragment InstalledPluginNode on InstalledPluginNode {
  __typename
  id
  code
  version
  kind
  types
  hostRuntime
}

query installedPlugins {
  centralServer {
    plugin {
      installedPlugins {
        __typename
        totalCount
        nodes {
          ...InstalledPluginNode
        }
      }
    }
  }
}

# Reads a bundle already uploaded, before installing it. A bundle carrying a
# form plugin needs the installer's choices, which the server names here: the
# program for each program key (with the one an earlier install bound it to),
# each document type's existing registry entry and whether installing it would
# blank the old client's form, and the programs on this server to choose from
# (plugin-management contract › preview). A bundle with no form plugin has an
# empty formPlugins and installs with nothing asked.
query uploadedPluginInfo($fileId: String!) {
  centralServer {
    plugin {
      uploadedPluginInfo(fileId: $fileId) {
        __typename
        ... on PluginInfoNode {
          formInstallPreview {
            formPlugins {
              pluginCode
              programKeys {
                programKey
                documentTypes
                boundProgram {
                  id
                  name
                }
              }
              documentTypes {
                documentType
                name
                category
                programKey
                existingEntry
                existingEntryId
                existingEntryOwner
                blanksOldUi
              }
            }
            programs {
              id
              name
            }
          }
        }
        ... on UploadedPluginError {
          error
        }
      }
    }
  }
}

# The three optional arguments are a form plugin's installer choices: the
# program for each program key, the document types whose existing entry it may
# take over, and the types whose form may go blank on sites still running the
# old client (plugin-management contract › install).
mutation installUploadedPlugin(
  $fileId: String!
  $programs: [PluginProgramInput!]
  $takeOver: [String!]
  $blankOldUi: [String!]
) {
  centralServer {
    plugins {
      installUploadedPlugin(
        fileId: $fileId
        programs: $programs
        takeOver: $takeOver
        blankOldUi: $blankOldUi
      ) {
        pluginInfo
      }
    }
  }
}

mutation uninstallPlugin($id: String!) {
  centralServer {
    plugins {
      uninstallPlugin(id: $id) {
        id
        code
        kind
      }
    }
  }
}

query pluginConfiguration($pluginCode: String!, $storeId: String!) {
  pluginData(
    pluginCode: $pluginCode
    storeId: $storeId
    filter: { dataIdentifier: { equalTo: "configuration" } }
  ) {
    __typename
    ... on PluginDataConnector {
      nodes {
        id
        data
        storeId
      }
    }
  }
}

mutation insertPluginConfiguration(
  $storeId: String!
  $input: InsertPluginDataInput!
) {
  insertPluginData(input: $input, storeId: $storeId) {
    ... on PluginDataNode {
      __typename
      id
    }
  }
}

mutation updatePluginConfiguration(
  $storeId: String!
  $input: UpdatePluginDataInput!
) {
  updatePluginData(input: $input, storeId: $storeId) {
    ... on PluginDataNode {
      __typename
      id
    }
  }
}
