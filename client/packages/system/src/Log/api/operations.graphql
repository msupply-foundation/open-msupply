fragment LogLevelRow on LogLevelNode {
  __typename
  level
}

fragment LogRow on LogNode {
  __typename
  fileNames
}

query logLevel {
  logLevel {
    __typename
    ... on LogLevelNode {
      ...LogLevelRow
    }
  }
}

query logFileNames {
  logFileNames {
    __typename

    ... on LogNode {
      ...LogRow
    }
  }
}
