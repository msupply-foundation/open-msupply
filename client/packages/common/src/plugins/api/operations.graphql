# This UI declares itself: the React module-federation host, from before the
# plugin API contract existed — hence version 0, which is what `react` bundles
# are recorded at. The server answers with those bundles and no others.
#
# The values are literals rather than variables because they are not a runtime
# choice: they are what this bundle IS. The SolidJS front end, served by the
# same backend at `/`, declares `solid` with its own pair and is answered with
# its own bundles, which we could not evaluate.
query frontendPluginMetadata {
  frontendPluginMetadata(
    host: { runtime: "react", version: 0, minSupported: 0 }
  ) {
    code
    path
    hash
  }
}

query pluginGraphqlQuery(
  $storeId: String!
  $input: JSON!
  $pluginCode: String!
) {
  pluginGraphqlQuery(input: $input, pluginCode: $pluginCode, storeId: $storeId)
}
