<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>open mSupply</title>
    <!-- Apply the stored theme before first paint so a dark user sees no flash
         of light. Kept in sync afterwards by src/theme/ThemeProvider. -->
    <script>
      try {
        if (localStorage.getItem('oms-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {
        /* localStorage unavailable — fall back to the light default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
